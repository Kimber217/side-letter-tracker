function mfnSummary(lp) {
  const m = lp.mfn || {};
  if (!m.hasMfn) return "No MFN";
  const base = m.basis === "all" ? "All terms" : m.basis === "manual" ? "Case by case" : `Size-based, limit ${C.usd(m.thresholdUsd ?? lp.commitmentUsd)}`;
  const ex = [...(m.excludedCategories || []).map(catName), ...(m.excludedGrantBases || []).map((b) => C.grantBasisLabel(b).toLowerCase() + " terms")];
  return base + (ex.length ? `; excludes ${ex.join(", ")}` : "");
}

function ProposedCheck() {
  const s = useStore();
  const [recv, setRecv] = useState("");
  const [nl, setNl] = useState({ name: "", commitment: "" });
  const [form, setForm] = useState({ category: "fees", text: "", mfnStatus: "electable", mfnReason: "", bundleId: "", grantBasis: [], conditions: "" });
  const [res, setRes] = useState(null);
  const receiving = recv === "new" ? { id: "proposed-lp", name: nl.name || "New LP", commitmentUsd: Number(nl.commitment) * 1e6 } : s.lps.find((l) => l.id === recv);
  const bundles = receiving ? s.bundles.filter((b) => b.lpId === receiving.id) : [];
  async function check() {
    const proposed = { id: "proposed", category: form.category, summary: form.text, mfnStatus: form.mfnStatus, mfnReason: form.mfnReason || "Proposed", grantBasis: form.grantBasis, conditions: form.conditions.trim() || "None" };
    const bundle = form.bundleId ? s.bundles.find((b) => b.id === form.bundleId) : null;
    const group = bundle ? [...s.terms.filter((t) => bundle.termIds.includes(t.id) && C.isLive(t)), proposed] : [proposed];
    const rows = s.lps.filter((l) => l.id !== receiving.id).map((lp) => ({ lp, ...itemEligibility(lp, receiving, group, bundle && bundle.allOrNothing ? bundle : null) }))
      .sort((a, b) => ["eligible", "review", "not_eligible"].indexOf(a.status) - ["eligible", "review", "not_eligible"].indexOf(b.status));
    const approved = s.terms.filter((t) => t.status === "approved");
    setRes({ rows, bundle, group, similar: null, simState: RT.sample ? "run" : "off" });
    let similar = approved.filter((t) => t.category === form.category).map((t) => ({ t, why: "Same category" }));
    if (RT.sample) {
      try {
        const prompt = `A private infrastructure fund is about to offer this term to an LP: "${form.text}" (category ${catName(form.category)}).
List up to 8 terms already granted to other LPs that are the same or similar in substance (same benefit, a weaker or stronger version, or the same subject). Most similar first.
Granted terms (id | LP | category | summary):
${approved.slice(0, 120).map((t) => `${t.id} | ${lpName(t.lpId)} | ${catName(t.category)} | ${t.summary}`).join("\n")}
Reply with only JSON: {"similar":[{"termId":"<id>","why":"one short phrase"}]}`;
        const r = await callModel(prompt);
        const list = (Array.isArray(r.json?.similar) ? r.json.similar : []).map((x) => ({ t: approved.find((t) => t.id === x.termId), why: String(x.why || "") })).filter((x) => x.t);
        similar = list; setRes((p) => ({ ...p, similar, simState: "done", model: r.model, modelApplied: r.modelApplied }));
        return;
      } catch (e) { setRes((p) => ({ ...p, similar, simState: "error", error: errText(e) })); return; }
    }
    setRes((p) => ({ ...p, similar }));
  }
  const can = receiving && (recv !== "new" || Number(nl.commitment) > 0) && form.text.trim().length > 5 && Array.isArray(form.grantBasis);
  const counts = res ? { e: res.rows.filter((r) => r.status === "eligible").length, r: res.rows.filter((r) => r.status === "review").length } : null;
  return html`<div class="stack">
    <p class="muted">Before offering a term, see what similar terms you have already granted and which LPs could claim the new one through their MFN.</p>
    <div class="card form">
      <div class="grid2">
        <${Field} label="LP receiving the term"><select id="pc-lp" value=${recv} onChange=${(e) => { setRecv(e.target.value); setForm({ ...form, bundleId: "" }); }}><option value="">Choose…</option>${s.lps.map((l) => html`<option value=${l.id}>${l.name} (${C.usd(l.commitmentUsd)})</option>`)}<option value="new">An LP not yet signed</option></select><//>
        <${Field} label="Category"><select id="pc-cat" value=${form.category} onChange=${(e) => setForm({ ...form, category: e.target.value })}>${categoryList().map((c) => html`<option value=${c.id}>${c.name}</option>`)}</select><//>
        ${recv === "new" ? html`<${Field} label="LP name"><input id="pc-nn" type="text" value=${nl.name} onInput=${(e) => setNl({ ...nl, name: e.target.value })} /><//><${Field} label="Expected commitment ($M)"><input id="pc-nc" type="number" value=${nl.commitment} onInput=${(e) => setNl({ ...nl, commitment: e.target.value })} /><//>` : null}
        <${Field} label="The term you plan to offer" wide><textarea id="pc-text" rows="3" placeholder="e.g. Management fee reduced by 0.10% for commitments of $40M or more" value=${form.text} onInput=${(e) => setForm({ ...form, text: e.target.value })}></textarea><//>
        <${Field} label="Would it be electable under MFN?"><${Seg} value=${form.mfnStatus} onChange=${(v) => setForm({ ...form, mfnStatus: v })} options=${[["electable", "Electable"], ["excluded", "Excluded"]]} /><//>
        <${Field} label="Granted for" hint="Carve-outs in other LPs' MFN clauses use this"><${GrantBasisField} id="pc-gb" value=${form.grantBasis} onChange=${(v) => setForm({ ...form, grantBasis: v })} /><//>
        <${Field} label="Conditions" hint='e.g. "Commitment of $60M or more"; blank if none'><input id="pc-cond" type="text" value=${form.conditions} onInput=${(e) => setForm({ ...form, conditions: e.target.value })} /><//>
        <${Field} label="Part of a bundle"><select id="pc-bnd" value=${form.bundleId} onChange=${(e) => setForm({ ...form, bundleId: e.target.value })}><option value="">No</option>${bundles.map((b) => html`<option value=${b.id}>${b.name}</option>`)}</select><//>
      </div>
      <div class="row end"><button class="btn primary" disabled=${!can} onClick=${check}>Check</button></div>
    </div>
    ${res ? html`<div class="card">
      <h3>Who could claim it</h3>
      <p>${counts.e ? html`<${Pill} kind="info">${counts.e} ${counts.e === 1 ? "LP" : "LPs"} could elect this<//>` : html`<${Pill} kind="ok">No LP could elect this<//>`} ${counts.r ? html`<${Pill} kind="warn">${counts.r} need a decision<//>` : null}</p>
      ${res.bundle ? html`<div class="bundle-box"><strong>Checked as part of "${res.bundle.name}"${res.bundle.allOrNothing ? " (all-or-nothing)" : ""}</strong><ul>${res.group.map((t) => html`<li><${Pill} kind="cat">${catName(t.category)}<//> ${t.summary}</li>`)}</ul></div>` : null}
      <${EligTable} rows=${res.rows} />
      <p class="small muted">This flags LPs that might be able to claim the term. A person or counsel makes the final call.</p>
    </div>
    <div class="card"><h3>Similar terms already granted</h3>
      ${res.simState === "run" ? html`<p class="muted">Comparing with every approved term…</p>` : null}
      ${res.simState === "error" ? html`<p class="note warn">Similarity check failed (${res.error}); showing every approved term in the same category.</p>` : null}
      ${res.simState === "off" ? html`<p class="note">Claude is not available here; showing every approved term in the same category.</p>` : null}
      ${res.similar ? (res.similar.length ? res.similar.map((x) => html`<${TermCard} key=${x.t.id} t=${x.t} extra=${html`<p class="small muted">Why it's similar: ${x.why}</p>`} />`) : html`<${Empty} title="Nothing similar on record" />`) : null}
    </div>` : null}
  </div>`;
}

function Packages() {
  const s = useStore();
  const withMfn = s.lps.filter((l) => l.mfn?.hasMfn);
  const inReview = s.letters.filter((l) => ["needs_review", "failed", "extracting", "pending"].includes(l.status));
  const waitingIds = new Set(inReview.map((l) => l.lpId));
  const ready = withMfn.filter((l) => !waitingIds.has(l.id));
  const waiting = withMfn.filter((l) => waitingIds.has(l.id));
  async function generate() {
    await act("Generating worksheets", async () => {
      for (const lp of waiting) {
        const stale = s.elections.find((e) => e.lpId === lp.id && e.status === "draft");
        if (!stale) continue;
        await patch("elections/" + stale.id, { archived: { at: new Date().toISOString(), by: RT.meId, reason: "LP's side letter is in review" } });
        await appendAudit("election.archived", "election", stale.id, `Archived ${lp.name}'s draft worksheet: its side letter is in review`, { reason: "letter in review" });
      }
      for (const lp of ready) {
        const existing = s.elections.find((e) => e.lpId === lp.id && e.status === "draft");
        const signed = s.elections.find((e) => e.lpId === lp.id && e.status !== "draft");
        if (signed) continue;
        const pkg = buildPackage(lp, store.state);
        const id = existing?.id || rid("el");
        const doc = { lpId: lp.id, status: "draft", createdAt: new Date().toISOString(), createdBy: RT.meId, ...pkg, signoff: null, sentAt: null, choices: {}, lettersInReview: inReview.map((l) => l.id) };
        await put("elections/" + id, doc);
        await appendAudit(existing ? "election.regenerated" : "election.generated", "election", id, `${existing ? "Regenerated" : "Generated"} MFN election worksheet for ${lp.name}: ${pkg.items.length} items offered or awaiting a decision, ${pkg.notIncluded.length} not eligible, of ${pkg.considered} electable${inReview.length ? `; ${inReview.length} letters in review left out` : ""}`, { items: pkg.items.map((i) => ({ key: i.key, eligibility: i.eligibility })), notIncluded: pkg.notIncluded.map((n) => n.key), lettersInReview: inReview.map((l) => l.id), hash: await itemsHash(pkg.items) });
      }
      toast("ok", `Worksheets generated for ${ready.length} LPs${waiting.length ? `; ${waiting.length} waiting for letter review` : ""}. Each needs counsel sign-off.`);
    });
  }
  const signedCount = s.elections.filter((e) => e.status !== "draft").length;
  const archived = s.all.elections.filter((e) => e.archived);
  return html`<div class="stack">
    <p class="note">Internal working list: do not send to the LP. Each worksheet names which LP holds every term and lists the terms this LP can't claim. The election package sent to an LP is prepared separately from its offered items.</p>
    <p class="muted">Usually done after the final close. Every approved, electable term held by other LPs is offered, marked "Needs a decision", or listed with the reason it isn't eligible. All-or-nothing bundles are offered whole.</p>
    ${inReview.length ? html`<div class="note warn"><p><strong>${inReview.length} side ${inReview.length === 1 ? "letter is" : "letters are"} still in review:</strong> ${inReview.map((l) => lpName(l.lpId)).join(", ")}.</p>
      <p>Their draft terms won't appear in any worksheet${waiting.length ? `, and ${waiting.map((l) => l.name).join(", ")} ${waiting.length === 1 ? "gets" : "get"} no worksheet until ${waiting.length === 1 ? "its letter is" : "their letters are"} approved` : ""}. You can wait and finish the reviews first, or generate now for the other ${ready.length} LPs.</p>
      <div class="row"><a class="btn" href="#review">Go to the review queue</a><button class="btn" disabled=${s.readOnly || !ready.length} onClick=${generate}>Generate anyway for ${ready.length} LPs</button></div></div>`
    : html`<div class="row"><button class="btn primary" disabled=${s.readOnly || !ready.length} onClick=${generate}>Generate worksheets for ${ready.length} LPs with MFN</button></div>`}
    ${signedCount ? html`<span class="small muted">${signedCount} signed-off worksheets are locked and won't be regenerated.</span>` : null}
    ${waiting.length ? html`<p class="small muted">Waiting for letter review: ${waiting.map((l) => l.name).join(", ")}.</p>` : null}
    ${s.elections.length ? [...s.elections].sort((a, b) => lpName(a.lpId).localeCompare(lpName(b.lpId))).map((e) => html`<${PackageCard} key=${e.id} e=${e} />`) : html`<${Empty} title="No worksheets yet">Generate them when the fund is ready to run the MFN process.<//>`}
    ${archived.length ? html`<details class="card"><summary>${archived.length} archived ${archived.length === 1 ? "worksheet" : "worksheets"}</summary>
      <ul class="small">${archived.map((e) => html`<li key=${e.id}>${lpName(e.lpId)} · generated ${fmtTime(e.createdAt)} · archived ${fmtTime(e.archived.at)}${e.archived.reason ? ` (${e.archived.reason})` : ""} <${RestoreButton} col="elections" rec=${e} label=${lpName(e.lpId) + "'s worksheet"} /></li>`)}</ul></details>` : null}
  </div>`;
}

/* Archive and restore: records stay in the database and the audit log; archived ones drop out of working lists. */
async function setArchived(col, rec, label, on, reason) {
  return act(on ? "Archiving" : "Restoring", async () => {
    await patch(col + "/" + rec.id, { archived: on ? { at: new Date().toISOString(), by: RT.meId, reason: reason || "" } : null });
    const kind = { lps: "lp", letters: "letter", elections: "election" }[col];
    await appendAudit(kind + (on ? ".archived" : ".restored"), kind, rec.id, `${on ? "Archived" : "Restored"} ${label}${on && reason ? ": " + reason : ""}`, { reason: reason || "" });
    toast("ok", `${on ? "Archived" : "Restored"} ${label}.`);
  });
}
function ArchiveButton({ col, rec, label, disabled }) {
  const s = useStore();
  const [open, setOpen] = useState(false); const [why, setWhy] = useState("");
  if (s.readOnly) return null;
  return open ? html`<span class="row"><input id=${"arch-" + rec.id} type="text" placeholder="Why archive? (optional)" value=${why} onInput=${(e) => setWhy(e.target.value)} />
      <button class="btn small" onClick=${async () => { await setArchived(col, rec, label, true, why.trim()); setOpen(false); }}>Archive ${label}</button><button class="btn small ghost" onClick=${() => setOpen(false)}>Cancel</button></span>`
    : html`<button class="btn small ghost" disabled=${disabled} onClick=${() => setOpen(true)}>Archive</button>`;
}
function RestoreButton({ col, rec, label }) {
  const s = useStore();
  return s.readOnly ? null : html`<button class="btn small ghost" onClick=${() => setArchived(col, rec, label, false)}>Restore</button>`;
}

function PackageCard({ e }) {
  const s = useStore();
  const [open, setOpen] = useState(false);
  const [hashNow, setHashNow] = useState(null);
  const [sentDate, setSentDate] = useState(new Date().toISOString().slice(0, 10));
  const [choiceDate, setChoiceDate] = useState(new Date().toISOString().slice(0, 10));
  const lp = s.lps.find((l) => l.id === e.lpId);
  useEffect(() => { itemsHash(e.items || []).then(setHashNow); }, [C.canon(e.items || [])]);
  const offered = (e.items || []).filter((i) => i.decision === "include");
  const undecided = (e.items || []).filter((i) => !i.decision);
  const locked = e.status !== "draft";
  const stale = e.status === "draft" && lp ? buildPackage(lp, s) : null;
  const changedSince = stale && (C.canon(stale.items.map((i) => [i.key, i.termIds, i.snapshot])) !== C.canon((e.items || []).map((i) => [i.key, i.termIds, i.snapshot])));
  async function decide(key, decision) {
    await act("Saving decision", async () => {
      const items = e.items.map((i) => (i.key === key ? { ...i, decision } : i));
      await patch("elections/" + e.id, { items });
      await appendAudit("election.decision", "election", e.id, `${decision === "include" ? "Included" : "Left out"} ${key} in ${lp?.name}'s package`, { key, decision });
    });
  }
  async function signoff() {
    await act("Signing off", async () => {
      const hash = await itemsHash(e.items);
      await patch("elections/" + e.id, { status: "signed_off", signoff: { by: RT.meId, at: new Date().toISOString(), hash } });
      await appendAudit("election.signed_off", "election", e.id, `Counsel signed off ${lp?.name}'s election package (${offered.length} items)`, { hash, items: offered.map((i) => i.key) });
      toast("ok", "Signed off. The package is now locked.");
    });
  }
  async function markSent() {
    await act("Recording", async () => {
      await patch("elections/" + e.id, { status: "sent", sentAt: sentDate });
      await appendAudit("election.sent", "election", e.id, `Recorded ${lp?.name}'s election package as sent on ${sentDate}`, { sentAt: sentDate });
    });
  }
  async function record(key, choice) {
    await act("Recording choice", async () => {
      const choices = { ...(e.choices || {}), [key]: { choice, date: choiceDate, by: RT.meId, at: new Date().toISOString() } };
      const all = offered.every((i) => choices[i.key]);
      await patch("elections/" + e.id, { choices, status: all ? "responded" : e.status });
      await appendAudit("election.choice", "election", e.id, `${lp?.name} ${choice} ${key} (dated ${choiceDate})`, { key, choice, date: choiceDate });
    });
  }
  const stPill = { draft: ["warn", "Draft"], signed_off: ["info", "Signed off by counsel"], sent: ["info", "Sent"], responded: ["ok", "Elections recorded"] }[e.status] || ["neutral", e.status];
  const archiveBtn = e.status === "draft" ? html`<${ArchiveButton} col="elections" rec=${e} label=${(lp?.name || "this LP") + "'s worksheet"} />` : null;
  const intact = !e.signoff || hashNow === e.signoff.hash;
  return html`<article class="card pkg">
    <header class="pkg-h"><div><h3>${lp?.name || "Unknown LP"}</h3><p class="small muted">${mfnSummary(lp || {})} · generated ${fmtTime(e.createdAt)}</p></div>
      <div class="row">${archiveBtn}<${Pill} kind=${stPill[0]}>${stPill[1]}<//>${e.signoff ? (intact ? html`<${Pill} kind="ok">Unchanged since sign-off<//>` : html`<${Pill} kind="bad">Changed after sign-off<//>`) : null}</div></header>
    <p class="small"><strong class="num">${e.considered}</strong> electable items held by other LPs considered: <strong class="num">${offered.length}</strong> offered, <strong class="num">${undecided.length}</strong> awaiting a decision, <strong class="num">${(e.items || []).filter((i) => i.decision === "exclude").length + (e.notIncluded || []).length}</strong> not offered (reasons below).</p>
    ${changedSince ? html`<p class="note warn">Approved terms have changed since this draft was generated. Regenerate before sign-off.</p>` : null}
    <button class="linkbtn" onClick=${() => setOpen(!open)}>${open ? "Hide details" : "Show items"}</button>
    ${open ? html`<div class="stack">
      ${(e.items || []).map((i) => html`<div class=${"pitem " + (i.decision || "undecided")}>
        <div class="row"><strong>${i.kind === "bundle" ? `Bundle: ${i.bundleName}` : i.snapshot[0].category}</strong> <span class="muted small">from ${i.snapshot[0].lpName}</span>
          ${i.allOrNothing ? html`<${Pill} kind="warn">all-or-nothing<//>` : null}
          ${i.eligibility === "review" ? html`<${Pill} kind="warn">Needs a decision<//>` : null}
          ${e.choices?.[i.key] ? html`<${Pill} kind=${e.choices[i.key].choice === "elected" ? "ok" : "neutral"}>${e.choices[i.key].choice} ${fmtDate(e.choices[i.key].date)}<//>` : null}</div>
        <ul>${i.snapshot.map((x) => html`<li>${x.summary}${x.conditions && x.conditions !== "None" ? html` <span class="muted small">(Conditions: ${x.conditions})</span>` : null}</li>`)}</ul>
        <p class="small muted">${i.reasons.join(". ")}</p>
        ${!locked && i.eligibility === "review" && !s.readOnly ? html`<div class="row"><button class=${"btn small" + (i.decision === "include" ? " primary" : "")} onClick=${() => decide(i.key, "include")}>Offer it</button><button class=${"btn small" + (i.decision === "exclude" ? " primary" : "")} onClick=${() => decide(i.key, "exclude")}>Don't offer</button></div>` : null}
        ${e.status === "sent" || e.status === "responded" ? (i.decision === "include" && !s.readOnly ? html`<div class="row"><button class="btn small" onClick=${() => record(i.key, "elected")}>LP elected</button><button class="btn small" onClick=${() => record(i.key, "declined")}>LP declined</button></div>` : null) : null}
      </div>`)}
      ${(e.notIncluded || []).length ? html`<details><summary>${e.notIncluded.length} not eligible, with reasons</summary><ul class="small">${e.notIncluded.map((n) => html`<li><strong>${n.label}</strong>: ${n.reasons.join(". ")}</li>`)}</ul></details>` : null}
    </div>` : null}
    <div class="row pkg-actions">
      ${e.status === "draft" ? html`<button class="btn primary" disabled=${s.readOnly || undecided.length > 0 || changedSince} onClick=${signoff}>Sign off as counsel</button>${undecided.length ? html`<span class="small muted">Decide the ${undecided.length} open ${undecided.length === 1 ? "item" : "items"} first.</span>` : null}` : null}
      ${e.status === "signed_off" ? html`<span class="small">Signed off by ${nameOf(e.signoff.by)}, ${fmtTime(e.signoff.at)}</span><input id=${"sent-" + e.id} type="date" value=${sentDate} onInput=${(x) => setSentDate(x.target.value)} /><button class="btn" disabled=${s.readOnly} onClick=${markSent}>Record as sent</button>` : null}
      ${e.status === "sent" || e.status === "responded" ? html`<span class="small">Sent ${fmtDate(e.sentAt)}. Choice date:</span><input id=${"cd-" + e.id} type="date" value=${choiceDate} onInput=${(x) => setChoiceDate(x.target.value)} />` : null}
      ${e.signoff ? html`<code class="hash small">${short(e.signoff.hash)}</code>` : null}
    </div>
  </article>`;
}

function Records() {
  const s = useStore();
  const rows = s.elections.flatMap((e) => Object.entries(e.choices || {}).map(([key, c]) => ({ e, key, c, item: (e.items || []).find((i) => i.key === key) }))).sort((a, b) => (a.c.at < b.c.at ? 1 : -1));
  return html`<div class="stack">
    <p class="muted">Every LP choice recorded from a signed-off package, with the date on the LP's election and who recorded it.</p>
    ${rows.length ? html`<div class="tablewrap"><table class="tbl"><thead><tr><th>LP</th><th>Item</th><th>Choice</th><th>Dated</th><th>Recorded by</th></tr></thead><tbody>
      ${rows.map((r) => html`<tr><td>${lpName(r.e.lpId)}</td><td>${r.item ? (r.item.kind === "bundle" ? "Bundle: " + r.item.bundleName : r.item.snapshot[0].summary) : r.key}<div class="small muted">from ${r.item?.snapshot?.[0]?.lpName || ""}</div></td>
        <td><${Pill} kind=${r.c.choice === "elected" ? "ok" : "neutral"}>${r.c.choice}<//></td><td class="num">${fmtDate(r.c.date)}</td><td>${nameOf(r.c.by)}<div class="small muted">${fmtTime(r.c.at)}</div></td></tr>`)}
    </tbody></table></div>` : html`<${Empty} title="No elections recorded yet">Choices appear here once a signed-off package is sent and the LP responds.<//>`}
  </div>`;
}

/* ---------------- LPs ---------------- */
function LpsView() {
  const s = useStore();
  const [edit, setEdit] = useState(null);
  const [editB, setEditB] = useState(null);
  async function saveLp() {
    await act("Saving LP", async () => {
      const before = s.lps.find((l) => l.id === edit.id);
      const doc = { name: edit.name.trim(), type: edit.type, commitmentUsd: Math.round(Number(edit.commitmentM) * 1e6), vehicle: edit.vehicle, close: edit.close,
        mfn: { hasMfn: edit.hasMfn, basis: edit.basis, thresholdUsd: edit.thresholdM === "" || edit.thresholdM == null ? null : Math.round(Number(edit.thresholdM) * 1e6), excludedCategories: edit.excludedCategories, excludedGrantBases: edit.excludedGrantBases || [], excludedTermIds: before?.mfn?.excludedTermIds || [], note: edit.note, ...(before?.mfn?.fromLetterId ? { fromLetterId: before.mfn.fromLetterId } : {}) } };
      await put("lps/" + edit.id, doc);
      await appendAudit(before ? "lp.updated" : "lp.created", "lp", edit.id, before ? `Updated LP ${doc.name} and its MFN setup` : `Added LP ${doc.name} (${C.usd(doc.commitmentUsd)})`, { before: before ? { commitmentUsd: before.commitmentUsd, mfn: before.mfn, type: before.type } : null, after: { commitmentUsd: doc.commitmentUsd, mfn: doc.mfn, type: doc.type } });

/* ===== UI part 3: quality (monitoring, test set, model pin), audit log, settings, app shell ===== */

/* ---------- test set runs ---------- */
async function runTestSet(model, purpose) {
  const s = store.state; const cases = [...s.tests].sort((a, b) => a.name.localeCompare(b.name));
  if (!cases.length) { toast("bad", "The test set is empty."); return; }
  if (!RT.sample) { toast("bad", "Claude is not available in this view, so the test set can't run."); return; }
  const runId = rid("run"); const at = new Date().toISOString();
  const ok = await act("Starting test run", async () => {
    await put("testRuns/" + runId, { model, promptVersion: C.PROMPT_VERSIONS.extract, at, by: RT.meId, status: "running", purpose, total: cases.length, cases: [] });
    return true;
  });
  if (!ok) return;
  store.set({ testRun: { id: runId, model, done: 0, total: cases.length, current: cases[0].name } });
  const results = [];
  for (const tc of cases) {
    store.set((st) => ({ testRun: { ...st.testRun, current: tc.name } }));
    try {
      const ex = await extractTerms(tc.paragraphs, { lpName: tc.lpName, lpType: tc.lpType, vehicle: tc.vehicle }, { model });
      const sc = C.scoreCase(tc.expected, ex.terms);
      const quoteFails = ex.terms.filter((t) => C.quoteCheck(t.quote, tc.paragraphs).status !== "pass").length;
      const cov = C.coverage({ id: "x", paragraphs: tc.paragraphs, noObligation: ex.noObligation }, ex.terms.map((t, i) => ({ ...t, id: "x" + i, letterId: "x", status: "draft" })));
      results.push({ caseId: tc.id, name: tc.name, modelApplied: ex.modelApplied, correct: sc.correct, total: sc.total, extracted: ex.terms.length, extra: sc.extra.length, quoteFails, unaccounted: cov.unaccounted,
        rows: sc.rows.map((r) => ({ result: r.result, category: r.expected.category, quote: r.expected.quote.slice(0, 90), wrong: r.wrong || [] })) });
    } catch (e) { results.push({ caseId: tc.id, name: tc.name, error: errText(e), correct: 0, total: tc.expected.length, extracted: 0, extra: 0, quoteFails: 0, unaccounted: [] }); }
    store.set((st) => ({ testRun: { ...st.testRun, done: results.length } }));
    try { await patch("testRuns/" + runId, { cases: results }); } catch {}
  }
  const correct = results.reduce((a, r) => a + r.correct, 0), total = results.reduce((a, r) => a + r.total, 0), extracted = results.reduce((a, r) => a + r.extracted, 0);
  const errors = results.filter((r) => r.error).length;
  const mismatch = results.filter((r) => !r.error && r.modelApplied !== model).length;
  const status = errors || mismatch ? "incomplete" : "complete";
  const accuracy = total ? correct / total : 0, precision = extracted ? correct / extracted : 0;
  const reason = errors ? `${errors} case${errors === 1 ? "" : "s"} failed to run` : mismatch ? `${mismatch} case${mismatch === 1 ? " was" : "s were"} answered by a model other than ${model}` : null;
  await act("Saving test run", async () => {
    await patch("testRuns/" + runId, { status, accuracy, precision, correct, totalExpected: total, extracted, finishedAt: new Date().toISOString(), reason });
    await appendAudit("testset.run", "testRun", runId, `Test set run with ${model}: ${correct} of ${total} expected terms fully correct (${C.pct(accuracy)})${reason ? "; " + reason : ""}`, { model, promptVersion: C.PROMPT_VERSIONS.extract, accuracy, precision, status, purpose });
  });
  store.set({ testRun: null });
  toast(status === "complete" ? "ok" : "bad", status === "complete" ? `Test run finished: ${C.pct(accuracy)} accurate.` : `Test run incomplete: ${reason}.`);
}

function MetricCard({ label, value, sub, state, href }) {
  return html`<a class=${"metric " + (state || "")} href=${href || "#quality"}><span class="mlabel">${label}</span><span class="mvalue num">${value}</span>${sub ? html`<span class="msub">${sub}</span>` : null}</a>`;
}

  const curRun = latestFor(pinned); const candRun = cand.trim() ? latestFor(cand.trim()) : null;
  const bar = curRun ? curRun.accuracy : 0.9;

      await appendAudit("model.switched", "config", "main", `Switched pinned model from ${old.pinned} to ${next} after a test run scored ${C.pct(candRun.accuracy)} (bar ${C.pct(bar)})`, { from: old.pinned, to: next, candidateRun: candRun.id, candidateAccuracy: candRun.accuracy, previousAccuracy: curRun?.accuracy ?? null });

      const id = "tc-" + l.id.slice(3);
      await put("tests/" + id, { name: lp.name, lpName: lp.name, lpType: lp.type, vehicle: l.vehicle, paragraphs: l.paragraphs, expected: terms.map((t) => ({ category: t.category, quote: t.quote, mfnStatus: t.mfnStatus, grantBasis: C.grantBasesOf(t), lpStatusBased: t.lpStatusBased ?? null })), expectedNoObligation: l.noObligation || [], sourceLetterId: l.id, createdAt: new Date().toISOString(), createdBy: RT.meId });

    </tbody></table></div>` : html`<${Empty} title="No test runs yet">Run the test set to measure accuracy for the pinned model.<//>`}
    ${openRun ? (() => { const r = runs.find((x) => x.id === openRun); return r ? html`<div class="card">${r.reason ? html`<p class="note warn">${r.reason}</p>` : null}${(r.cases || []).map((c) => html`<div class="case">
      <div class="row"><strong>${c.name}</strong> ${c.error ? html`<${Pill} kind="bad">Error<//>` : html`<span class="num">${c.correct}/${c.total} correct</span>`} ${c.extra ? html`<${Pill} kind="warn">${c.extra} extra<//>` : null} ${c.quoteFails ? html`<${Pill} kind="warn">${c.quoteFails} quote failures<//>` : null} ${c.unaccounted?.length ? html`<${Pill} kind="warn">¶ ${c.unaccounted.join(", ")} unaccounted<//>` : null} ${c.modelApplied && c.modelApplied !== r.model ? html`<${Pill} kind="bad">answered by ${c.modelApplied}<//>` : null}</div>
      ${c.error ? html`<p class="small bad-text">${c.error}</p>` : html`<ul class="small">${(c.rows || []).filter((x) => x.result !== "correct").map((x) => html`<li><${Pill} kind=${x.result === "missed" ? "bad" : "warn"}>${x.result}<//> ${catName(x.category)}: "${x.quote}…" ${x.wrong?.length ? "— " + x.wrong.join(", ") : ""}</li>`)}</ul>`}
    </div>`)}</div>` : null; })() : null}
  </section>`;
}

/* ---------- audit log ---------- */
function AuditView() {
  const s = useStore();
  const [q, setQ] = useState(""); const [open, setOpen] = useState(null); const [limit, setLimit] = useState(100);
  const list = [...s.audit].sort((a, b) => b.seq - a.seq).filter((e) => !q || (e.summary + " " + e.action + " " + nameOf(e.actor)).toLowerCase().includes(q.toLowerCase()));
  useEffect(() => { wantNames([...new Set(s.audit.map((e) => e.actor))]); }, [s.audit.length]);
  const ch = s.chain;
  return html`<section class="view">
    <div class="view-h"><div><h1>Audit log</h1><p class="muted">Every change, newest first. Each entry stores the previous entry's SHA-256, so editing or deleting any entry breaks the chain from that point. Tampering is detected, not prevented.</p></div></div>
    <div class=${"card chain " + (ch ? (ch.ok ? "ok" : "bad") : "")}>
      <div class="row"><strong>${ch ? (ch.ok ? "Chain intact" : "Chain broken") : "Checking the chain…"}</strong>${ch ? html`<span class="small muted">${ch.checked} entries · head at entry ${s.auditHead?.seq} · checked ${fmtTime(ch.at)}</span>` : null}<button class="btn small" onClick=${recheckChainFresh}>Re-check</button></div>
      ${ch && !ch.ok ? html`<ul class="small">${ch.problems.map((p) => html`<li>${p.message}</li>`)}</ul>` : null}
      ${s.auditHead ? html`<div class="small">Latest hash <code class="hash">${s.auditHead.hash}</code></div>` : null}
    </div>
    <input id="audit-q" type="search" placeholder="Filter entries" value=${q} onInput=${(e) => setQ(e.target.value)} />
    <ol class="audit">${list.slice(0, limit).map((e) => html`<li key=${e.seq} class=${ch?.bySeq?.[e.seq] === "broken" ? "broken" : ""}>
      <div class="a-h"><span class="num seq">#${e.seq}</span><span class="small muted">${fmtTime(e.ts)}</span><span class="small">${nameOf(e.actor)}</span><code class="small">${e.action}</code>${ch?.bySeq?.[e.seq] === "broken" ? html`<${Pill} kind="bad">fails check<//>` : null}</div>
      <p>${e.summary}</p>
      <button class="linkbtn small" onClick=${() => setOpen(open === e.seq ? null : e.seq)}>${open === e.seq ? "Hide details" : "Details"}</button>
      ${open === e.seq ? html`<div class="a-d"><div class="small">Hash <code class="hash">${e.hash}</code></div><div class="small">Previous <code class="hash">${e.prevHash}</code></div><pre>${JSON.stringify(e.data, null, 2)}</pre></div>` : null}
    </li>`)}</ol>
    ${list.length > limit ? html`<button class="btn" onClick=${() => setLimit(limit + 200)}>Show more</button>` : null}
  </section>`;
}

/* ---------- settings ---------- */
function ConfigView() {
  const s = useStore();
  const cfg = s.config;
  const [cats, setCats] = useState(null);
  const [veh, setVeh] = useState("");
  const [fee, setFee] = useState(null);
  if (!cfg) return html`<section class="view"><${Empty} title="Settings are loading" /></section>`;
  const used = (id) => s.terms.filter((t) => t.category === id).length;
  const draft = cats || cfg.categories.map((c) => ({ ...c, kw: c.keywords.join(", ") }));
  async function saveCats() {
    await act("Saving categories", async () => {
      const next = draft.map((c) => ({ id: c.id, name: c.name.trim() || c.id, keywords: c.kw.split(",").map((x) => x.trim().toLowerCase()).filter(Boolean) }));
      await patch("config/main", { categories: next });
      await appendAudit("categories.updated", "config", "main", `Updated term categories (${next.length})`, { before: cfg.categories, after: next });
      setCats(null); toast("ok", "Categories saved.");
    });
  }
  async function addVehicle() {
    await act("Adding vehicle", async () => {
      const next = [...cfg.vehicles, veh.trim()];
      await patch("config/main", { vehicles: next });
      await appendAudit("vehicles.updated", "config", "main", `Added vehicle "${veh.trim()}"`, { before: cfg.vehicles, after: next });
      setVeh("");
    });
  }
  async function saveFee() {
    await act("Saving", async () => {
      const fund = { ...cfg.fund, standardFeePct: Number(fee) };
      await patch("config/main", { fund });
      await appendAudit("fund.updated", "config", "main", `Set standard management fee to ${fee}%`, { before: cfg.fund.standardFeePct, after: Number(fee) });
      setFee(null);
    });
  }
  const capRow = (k, label, offText) => html`<div><dt>${label}</dt><dd>${s.caps[k] === "on" ? html`<${Pill} kind="ok">On<//>` : s.caps[k] === "loading" ? html`<${Pill} kind="info">Checking<//>` : html`<${Pill} kind="warn">Off<//>`} <span class="small muted">${s.caps[k] === "off" ? offText : ""}</span></dd></div>`;
  return html`<section class="view">
    <div class="view-h"><h1>Settings</h1></div>
    <div class="card"><h3>Fund</h3>
      <dl class="facts"><div><dt>Fund</dt><dd>${cfg.fund.name}</dd></div><div><dt>Standard management fee</dt><dd>${fee === null ? html`${cfg.fund.standardFeePct}% <button class="linkbtn" disabled=${s.readOnly} onClick=${() => setFee(cfg.fund.standardFeePct)}>edit</button>` : html`<input id="std-fee" type="number" step="0.05" value=${fee} onInput=${(e) => setFee(e.target.value)} /> <button class="btn small" onClick=${saveFee}>Save</button>`}</dd></div>
        <div><dt>Carry / hurdle</dt><dd>${cfg.fund.standardCarryPct}% / ${cfg.fund.hurdlePct}%</dd></div><div><dt>MFN clause</dt><dd>${cfg.fund.mfnSection}</dd></div></dl>
      <h3>Vehicles</h3><ul>${cfg.vehicles.map((v) => html`<li>${v}</li>`)}</ul>
      <div class="row"><input id="new-veh" type="text" placeholder="e.g. Co-investment vehicle" value=${veh} onInput=${(e) => setVeh(e.target.value)} /><button class="btn" disabled=${!veh.trim() || s.readOnly} onClick=${addVehicle}>Add vehicle</button></div>
    </div>
    <div class="card"><div class="row"><h3>Term categories</h3><span class="small muted">Keywords drive the keyword cross-check in search.</span></div>
      <div class="tablewrap"><table class="tbl"><thead><tr><th>Name</th><th>Keywords (comma-separated)</th><th>Terms</th><th></th></tr></thead><tbody>
        ${draft.map((c, i) => html`<tr key=${c.id}><td><input id=${"cn-" + c.id} type="text" value=${c.name} onInput=${(e) => setCats(draft.map((x, j) => (j === i ? { ...x, name: e.target.value } : x)))} /></td>
          <td><input id=${"ck-" + c.id} class="wideinput" type="text" value=${c.kw} onInput=${(e) => setCats(draft.map((x, j) => (j === i ? { ...x, kw: e.target.value } : x)))} /></td>
          <td class="num">${used(c.id)}</td><td>${used(c.id) ? html`<span class="small muted">in use</span>` : html`<button class="btn small ghost" onClick=${() => setCats(draft.filter((_, j) => j !== i))}>Remove</button>`}</td></tr>`)}
      </tbody></table></div>
      <div class="row"><button class="btn" onClick=${() => setCats([...draft, { id: "cat-" + Math.random().toString(36).slice(2, 7), name: "New category", kw: "" }])}>Add category</button>
        <button class="btn primary" disabled=${!cats || s.readOnly} onClick=${saveCats}>Save categories</button>${cats ? html`<button class="btn ghost" onClick=${() => setCats(null)}>Discard</button>` : null}</div>
    </div>
    <div class="card"><h3>This view</h3><dl class="facts">
      ${capRow("db", "Shared database", "Nothing can load or save.")}
      ${capRow("sample", "Claude (extraction, search)", "Enter terms by hand and use the filters.")}
      ${capRow("assets", "Read-only file store", "Small originals are kept in the database instead.")}
      ${capRow("downloads", "Download originals", "")}
      <div><dt>Your access</dt><dd>${s.readOnly ? html`<${Pill} kind="warn">View only<//>` : html`<${Pill} kind="ok">Can make changes<//>`}</dd></div>
    </dl><p class="small muted">Prototype: made-up data only. Access controls by role, obligation reminders, conflict warnings and LPA links are planned for later versions.</p></div>
  </section>`;
}

/* ---------- shell ---------- */
function parseRoute(h) {
  h = (h || "").replace(/^#/, "");
  if (!h) return { v: "search" };
  if (h.startsWith("letter-")) return { v: "letter", id: h.slice(7) };
  if (h.startsWith("review-")) return { v: "reviewletter", id: h.slice(7) };
  if (h === "mfn-packages") return { v: "mfn", sub: "packages" };
  if (h === "mfn-records") return { v: "mfn", sub: "records" };
  return { v: h };
}
function App() {
  const s = useStore();
  const [route, setRoute] = useState(parseRoute(location.hash));
  useEffect(() => { const f = () => setRoute(parseRoute(location.hash)); window.addEventListener("hashchange", f); return () => window.removeEventListener("hashchange", f); }, []);
  const m = useMemo(() => C.metrics(s), [s.letters, s.terms, s.testRuns, s.config]);
  const alerts = [...C.alertsFrom(m, s.baseline)];
  if (s.chain && !s.chain.ok) alerts.unshift({ key: "chain", message: "The audit log failed its chain check: an entry was edited or deleted" });
  const badInteg = Object.values(s.integrity).filter((x) => x.status === "mismatch").length;
  if (badInteg) alerts.unshift({ key: "integ", message: `${badInteg} original ${badInteg === 1 ? "document fails" : "documents fail"} the hash check` });
  const reviewCount = s.letters.filter((l) => ["needs_review", "failed"].includes(l.status)).length;
  const loaded = s.ready.config && s.ready.letters && s.ready.terms;
  const nav = [["search", "Search"], ["letters", "Side letters"], ["review", "Review", reviewCount], ["mfn", "MFN"], ["lps", "LPs"], ["quality", "Quality", alerts.length ? "!" : null], ["audit", "Audit log"], ["config", "Settings"]];
  const active = { letter: "letters", reviewletter: "review", add: "letters" }[route.v] || route.v;
  let view;
  if (s.caps.db === "off") view = html`<section class="view"><${Empty} title="The shared database isn't available in this view">Open this page in Claude while signed in to see and change the side letter records.<//></section>`;
  else if (!loaded) view = html`<section class="view"><div class="loading">${s.slowNote ? "Still waiting for the shared database. Your connection may be slow; records will appear when it answers." : "Loading records…"}</div></section>`;
  else if (!s.config) view = html`<section class="view"><${Empty} title="No settings found">The database has no fund settings yet.<//></section>`;
  else view = ({
    search: () => html`<${SearchView} />`, letters: () => html`<${LettersView} />`, letter: () => html`<${LetterDetail} id=${route.id} />`, add: () => html`<${IntakeView} />`,
    review: () => html`<${ReviewList} />`, reviewletter: () => html`<${ReviewLetter} id=${route.id} />`, mfn: () => html`<${MfnView} sub=${route.sub} />`,
    lps: () => html`<${LpsView} />`, quality: () => html`<${QualityView} />`, audit: () => html`<${AuditView} />`, config: () => html`<${ConfigView} />`,
  }[route.v] || (() => html`<${SearchView} />`))();
  const meName = RT.meId ? s.names[RT.meId] : "";
  return html`<div class="app">
    <header class="top"><div class="top-in">
      <a class="brand" href="#search"><span class="mark" aria-hidden="true">§</span><span><strong>Side Letter Tracker</strong><span class="fund">${s.config?.fund?.name || ""}</span></span></a>
      <div class="who">${s.readOnly ? html`<${Pill} kind="warn">View only<//>` : null}${s.busy ? html`<span class="busy">${s.busy}…</span>` : null}<span class="small muted">${meName || ""}</span></div>
    </div>
    <nav class="tabs" aria-label="Sections"><div class="tabs-in">${nav.map(([k, l, badge]) => html`<a href=${"#" + k} class=${active === k ? "on" : ""}>${l}${badge ? html`<span class=${"badge" + (badge === "!" ? " alert" : "")}>${badge}</span>` : null}</a>`)}</div></nav></header>
    ${alerts.length && loaded ? html`<div class="alertbar"><div class="alertbar-in"><strong>${alerts.length} ${alerts.length === 1 ? "alert" : "alerts"}</strong><span>${alerts.map((a) => a.message).join(" · ")}</span><a href="#quality">Review in Quality</a></div></div>` : null}
    <main>${view}</main>
    ${s.toast ? html`<div class=${"toast " + s.toast.kind} role="status">${s.toast.text}</div>` : null}
  </div>`;
}

render(html`<${App} />`, document.getElementById("root"));
boot();

</script>

</body></html>
