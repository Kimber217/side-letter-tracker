<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Side Letter Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: registry-style working tool. Sticky top bar with section tabs, one content column (max 1180px), cards only for things that act as separate objects. Clause text set in serif like the signed letter; data and hashes in mono. */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --surface-2: #EBEEF3; --line: #D5DBE4; --line-2: #E3E7EE;
  --ink: #142033; --ink-2: #43506A; --ink-3: #66738A;
  --accent: #2C4C94; --accent-ink: #FFFFFF; --accent-soft: #E2E9F7;
  --clause: #F8F7F2; --clause-rule: #B9A979;
  --ok: #1C7148; --ok-soft: #DFF1E7; --warn: #8C5A00; --warn-soft: #FAEBCB; --bad: #B0261B; --bad-soft: #FBE3E0; --info: #2C4C94; --info-soft: #E2E9F7;
  --cat: #4B3F8C; --cat-soft: #ECE9F8;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-clause: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px; --shadow: 0 1px 2px rgba(20, 32, 51, .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E131B; --surface: #151C27; --surface-2: #1C2533; --line: #2B3646; --line-2: #222C3A;
  --ink: #E5EAF2; --ink-2: #B2BCCC; --ink-3: #8B97AA;
  --accent: #93ABEA; --accent-ink: #0E131B; --accent-soft: #1F2B47;
  --clause: #1A2029; --clause-rule: #8A7C52;
  --ok: #67C695; --ok-soft: #14301F; --warn: #E3B254; --warn-soft: #33270E; --bad: #F2897E; --bad-soft: #3B1A16; --info: #93ABEA; --info-soft: #1F2B47;
  --cat: #B7AAF2; --cat-soft: #282244; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E131B; --surface: #151C27; --surface-2: #1C2533; --line: #2B3646; --line-2: #222C3A;
  --ink: #E5EAF2; --ink-2: #B2BCCC; --ink-3: #8B97AA;
  --accent: #93ABEA; --accent-ink: #0E131B; --accent-soft: #1F2B47;
  --clause: #1A2029; --clause-rule: #8A7C52;
  --ok: #67C695; --ok-soft: #14301F; --warn: #E3B254; --warn-soft: #33270E; --bad: #F2897E; --bad-soft: #3B1A16; --info: #93ABEA; --info-soft: #1F2B47;
  --cat: #B7AAF2; --cat-soft: #282244; --shadow: none; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
h1, h2, h3 { font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; line-height: 1.2; } h2 { font-size: 1.15rem; margin-top: 1.6rem; } h3 { font-size: 1rem; }
p { margin: 0; }
code, .mono { font-family: var(--f-mono); font-size: .86em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); } .small { font-size: .85rem; } .bad-text { color: var(--bad); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 9px; min-width: 0; max-width: 100%; }
textarea { width: 100%; resize: vertical; line-height: 1.45; }
input[type="checkbox"] { accent-color: var(--accent); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset:disabled input, fieldset:disabled select, fieldset:disabled textarea { background: var(--surface-2); color: var(--ink-2); }

.app { min-height: 100%; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in, .tabs-in, .alertbar-in, main { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px 6px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); min-width: 0; }
.brand:hover { text-decoration: none; }
.brand .mark { font-family: var(--f-clause); font-size: 1.6rem; line-height: 1; color: var(--accent); width: 32px; height: 32px; display: grid; place-items: center; border: 1.5px solid var(--accent); border-radius: 4px; flex: none; }
.brand strong { display: block; font-size: 1rem; }
.brand .fund { display: block; font-size: .78rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.busy { font-size: .8rem; color: var(--accent); }
.tabs { overflow-x: auto; scrollbar-width: none; } .tabs::-webkit-scrollbar { display: none; }
.tabs-in { display: flex; gap: 2px; }
.tabs a { padding: 8px 12px 9px; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; display: flex; gap: 6px; align-items: center; font-weight: 500; }
.tabs a:hover { color: var(--ink); text-decoration: none; }
.tabs a.on { color: var(--accent); border-bottom-color: var(--accent); }
.badge { font-size: .72rem; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.badge.alert { background: var(--bad-soft); color: var(--bad); }
.alertbar { background: var(--bad-soft); color: var(--bad); border-bottom: 1px solid var(--line); }
.alertbar-in { display: flex; flex-wrap: wrap; gap: 6px 14px; padding-block: 8px; font-size: .88rem; align-items: baseline; }
.alertbar a { color: var(--bad); text-decoration: underline; }
main { padding-block: 22px 60px; }

.view { display: flex; flex-direction: column; gap: 14px; }
.view.narrow { max-width: 780px; }
.view-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.view-h > div:first-child { min-width: 0; flex: 1 1 320px; display: flex; flex-direction: column; gap: 4px; }
.back { font-size: .85rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
.review-grid { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.3fr); gap: 16px; align-items: start; }
.review-grid .doc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); max-height: calc(100vh - 120px); overflow: auto; }
.view.wide { max-width: none; }
@media (max-width: 860px) { .two, .review-grid { grid-template-columns: minmax(0, 1fr); } .review-grid .doc { position: static; max-height: none; } }

.btn { font: inherit; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 13px; border-radius: var(--r); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--surface-2); text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.small { padding: 4px 9px; font-size: .84rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkbtn { font: inherit; background: none; border: 0; color: var(--accent); padding: 0; cursor: pointer; }
.linkbtn:disabled { color: var(--ink-3); cursor: not-allowed; }
.chip { font: inherit; font-size: .84rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); padding: 5px 10px; border-radius: 999px; cursor: pointer; text-align: left; }
.chip:hover { border-color: var(--accent); color: var(--accent); }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; letter-spacing: .01em; }
.pill-ok { background: var(--ok-soft); color: var(--ok); } .pill-warn { background: var(--warn-soft); color: var(--warn); } .pill-bad { background: var(--bad-soft); color: var(--bad); }
.pill-info { background: var(--info-soft); color: var(--info); } .pill-neutral { background: var(--surface-2); color: var(--ink-2); } .pill-cat { background: var(--cat-soft); color: var(--cat); }

.search-hero { display: flex; flex-direction: column; gap: 12px; padding-bottom: 4px; }
.search-hero h1 { font-size: 1.8rem; }
.askbar { display: flex; gap: 8px; }
.askbar input { flex: 1; font-size: 1.05rem; padding: 11px 14px; border-width: 1.5px; }
.examples { display: flex; flex-wrap: wrap; gap: 6px; }
.note { background: var(--info-soft); color: var(--ink); border-radius: var(--r); padding: 10px 12px; font-size: .88rem; display: flex; flex-direction: column; gap: 8px; }
.note.warn { background: var(--warn-soft); } .note.bad { background: var(--bad-soft); }
.filterbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 0; }
.filter-used { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 400px; }
.filter-actions { display: flex; gap: 6px; align-items: flex-start; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { background: var(--accent-soft); color: var(--accent); font-size: .82rem; padding: 3px 9px; border-radius: 4px; }
.filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 16px; }
.filters .wide { grid-column: 1 / -1; }
.toggles { display: flex; flex-wrap: wrap; gap: 5px; }
.toggles button, .seg button { font: inherit; font-size: .82rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); padding: 4px 9px; border-radius: 4px; cursor: pointer; }
.toggles button.on, .seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 0; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; } .seg button:last-child { border-radius: 0 4px 4px 0; }
.seg button:disabled { cursor: not-allowed; }
.checks { display: flex; flex-direction: column; gap: 4px; font-size: .88rem; }
.check { display: flex; gap: 8px; align-items: center; font-size: .88rem; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.flabel { font-size: .76rem; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
.fhint { font-size: .76rem; color: var(--ink-3); }
.field input, .field select { width: 100%; }
.results-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.results-head h2 { margin: 0; }
.results { display: flex; flex-direction: column; gap: 12px; }

.term { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; min-width: 0; box-shadow: var(--shadow); }
.term.editor.draft { border-left: 3px solid var(--warn); }
.term.editor.approved { border-left: 3px solid var(--ok); }
.term.editor.rejected, .term.editor.superseded { opacity: .7; }
.term-h { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.term-h .lp { font-weight: 600; margin-right: 4px; }
.summary { font-weight: 500; }
.clause { margin: 0; background: var(--clause); border-left: 2px solid var(--clause-rule); padding: 9px 12px; font-family: var(--f-clause); font-size: .95rem; line-height: 1.55; color: var(--ink); overflow-wrap: anywhere; }
.pmark { font-family: var(--f-mono); font-size: .74rem; color: var(--ink-3); margin-right: 8px; white-space: nowrap; }
mark { background: var(--warn-soft); color: inherit; padding: 0 1px; border-radius: 2px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 16px; margin: 0; }
.facts div { min-width: 0; } .facts dt { font-size: .72rem; color: var(--ink-3); font-weight: 600; letter-spacing: .02em; } .facts dd { margin: 0; font-size: .88rem; overflow-wrap: anywhere; }
.bundle-box { border: 1px dashed var(--line); border-radius: var(--r); padding: 9px 12px; font-size: .88rem; display: flex; flex-direction: column; gap: 4px; }
.bundle-box ul, .bundle-card ul, .pitem ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.prov { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--ink-3); border-top: 1px solid var(--line-2); padding-top: 7px; }
.flags { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.flag { font-size: .84rem; padding: 5px 9px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); }
.flag.quote, .flag.model, .flag.second { background: var(--bad-soft); color: var(--bad); }
.egrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px 14px; }
.quote-in { font-family: var(--f-clause); background: var(--clause); }
.quote-in.fail { border-color: var(--bad); }
.quote-in.pass { border-color: var(--ok); }
.newbundle { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 12px; border: 1px dashed var(--line); padding: 10px; border-radius: var(--r); }
.issue { border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
.issue input { flex: 1 1 220px; }

.paras { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.para { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 8px; padding: 8px 6px; border-radius: 4px; }
.para p { font-family: var(--f-clause); font-size: .93rem; line-height: 1.55; overflow-wrap: anywhere; }
.para .pn { font-family: var(--f-mono); font-size: .76rem; color: var(--ink-3); padding-top: 3px; }
.para.p-unaccounted { background: var(--warn-soft); }
.para.p-none p { color: var(--ink-3); }
.para .row { margin-top: 4px; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tbl th { text-align: left; font-size: .74rem; font-weight: 600; color: var(--ink-3); letter-spacing: .03em; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .rowlink { cursor: pointer; } .tbl .rowlink:hover td { background: var(--surface-2); }
.tbl input { width: 100%; min-width: 140px; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center; color: var(--ink-3); display: flex; flex-direction: column; gap: 6px; }
.empty strong { color: var(--ink-2); }
.loading { padding: 40px 0; color: var(--ink-3); }

.integrity.ok { border-left: 3px solid var(--ok); } .integrity.bad { border-left: 3px solid var(--bad); }
.integ-h { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.hashes { display: flex; flex-direction: column; gap: 6px; }
.hashes > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hash { font-family: var(--f-mono); font-size: .78rem; overflow-wrap: anywhere; word-break: break-all; color: var(--ink-2); }

.crosscheck h3 { margin: 0; }
.hits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.hits li { border-top: 1px solid var(--line-2); padding-top: 9px; display: flex; flex-direction: column; gap: 4px; }
.hit-h { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.hit-t { font-family: var(--f-clause); font-size: .92rem; color: var(--ink-2); overflow-wrap: anywhere; }

.form h3 { margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px 16px; }
.grid2.sub { border: 1px dashed var(--line); padding: 12px; border-radius: var(--r); }
.grid2 .wide { grid-column: 1 / -1; }
.drop { display: flex; align-items: center; gap: 10px; border: 1.5px dashed var(--line); border-radius: var(--r); padding: 18px; cursor: pointer; flex-wrap: wrap; }
.drop input { max-width: 100%; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
.step { display: flex; gap: 9px; align-items: baseline; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); flex: none; transform: translateY(-1px); }
.step.ok .dot, .done .dot { background: var(--ok); } .step.warn .dot, .todo .dot { background: var(--warn); } .step.bad .dot { background: var(--bad); }
.step.run .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .step.run .dot { animation: none; } }
.checklist { flex-direction: row; flex-wrap: wrap; gap: 8px 22px; font-size: .9rem; }
.checklist > div { display: flex; gap: 8px; align-items: baseline; }

.subnav { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.subnav a { padding: 7px 12px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.subnav a.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
.subnav a:hover { text-decoration: none; color: var(--ink); }
.pkg-h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pitem { border: 1px solid var(--line-2); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
.pitem.undecided { border-left: 3px solid var(--warn); } .pitem.include { border-left: 3px solid var(--ok); } .pitem.exclude { opacity: .65; }
.pkg-actions { border-top: 1px solid var(--line-2); padding-top: 10px; }
details summary { cursor: pointer; color: var(--accent); font-size: .88rem; }

.metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
.metric { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; color: var(--ink); border-top: 3px solid var(--line); min-width: 0; }
.metric:hover { text-decoration: none; border-color: var(--accent); }
.metric.ok { border-top-color: var(--ok); } .metric.warn { border-top-color: var(--warn); } .metric.bad { border-top-color: var(--bad); }
.mlabel { font-size: .76rem; font-weight: 600; color: var(--ink-3); }
.mvalue { font-size: 1.55rem; font-weight: 600; letter-spacing: -0.01em; }
.metric.bad .mvalue { color: var(--bad); } .metric.warn .mvalue { color: var(--warn); }
.msub { font-size: .76rem; color: var(--ink-3); }
.alerts { margin: 0; padding-left: 18px; color: var(--bad); }
.case { border-top: 1px solid var(--line-2); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.case ul { margin: 0; padding-left: 18px; }

.chain.ok { border-left: 3px solid var(--ok); } .chain.bad { border-left: 3px solid var(--bad); }
.audit { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.audit li { border-bottom: 1px solid var(--line-2); padding: 10px 2px; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.audit li.broken { background: var(--bad-soft); }
.a-h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }

<script>
/* ===== Side Letter Tracker: shared core (used by the page and by the seed script) ===== */
const CORE = (() => {
  const ZERO_HASH = "0".repeat(64);
  const PROMPT_VERSIONS = { extract: "extract-v1.0", verify: "verify-v1.0", search: "search-v1.0", similar: "similar-v1.0" };
  const UNCLEAR = "unclear";

  /* Canonical JSON: sorted keys, no undefined, so the same object always hashes the same way. */
  function canon(v) {
    if (v === null || typeof v !== "object") return JSON.stringify(v === undefined ? null : v);
    if (Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
    const keys = Object.keys(v).filter((k) => v[k] !== undefined).sort();
    return "{" + keys.map((k) => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}";
  }

  async function sha256Bytes(bytes) {
    const buf = await globalThis.crypto.subtle.digest("SHA-256", bytes);

  /* ---- Audit log: every entry carries the previous entry's hash ---- */
  function auditBody(e) {
    return { seq: e.seq, ts: e.ts, actor: e.actor, action: e.action, entityType: e.entityType, entityId: e.entityId, summary: e.summary, data: e.data ?? null, prevHash: e.prevHash };
  }
  async function hashAuditEntry(e) { return sha256Text(canon(auditBody(e))); }

  /* Returns {ok, checked, problems:[{seq, kind, message}], bySeq:{seq: "ok"|"broken"}} */
  async function verifyAuditChain(entries, head) {
    const list = [...entries].sort((a, b) => a.seq - b.seq);
    const problems = []; const bySeq = {};
    let prev = ZERO_HASH; let expectSeq = 1;
    for (const e of list) {
      let ok = true;
      if (e.seq !== expectSeq) {
        problems.push({ seq: e.seq, kind: "gap", message: e.seq > expectSeq ? `Entries ${expectSeq}–${e.seq - 1} are missing (deleted)` : `Entry ${e.seq} is out of order or duplicated` });

      }
      if (e.prevHash !== prev) { problems.push({ seq: e.seq, kind: "link", message: `Entry ${e.seq} does not point to the previous entry's hash` }); ok = false; }

      if (h !== e.hash) { problems.push({ seq: e.seq, kind: "edited", message: `Entry ${e.seq} was changed after it was written (hash mismatch)` }); ok = false; }
      bySeq[e.seq] = ok ? "ok" : "broken";

    }
    if (head) {
      const last = list[list.length - 1];
      if (!last && head.seq > 0) problems.push({ seq: head.seq, kind: "tail", message: `The log head says ${head.seq} entries exist but none were found` });
      else if (last && (head.seq !== last.seq || head.hash !== last.hash)) problems.push({ seq: head.seq, kind: "tail", message: `The log head (entry ${head.seq}) does not match the last entry found (entry ${last.seq}); entries at the end may have been deleted` });
    }

  }

  /* ---- Text helpers ---- */
  function normalizeForQuote(s) {
    return String(s || "")
      .replace(/[‘’‛′]/g, "'").replace(/[“”‟″]/g, '"')
      .replace(/[‐-―−]/g, "-").replace(/ /g, " ")
      .replace(/\s+/g, " ").trim();
  }
  function documentText(paragraphs) { return (paragraphs || []).join("\n\n"); }

  /* Exact quote check. "pass": the quote appears word-for-word in the document (whitespace and curly quotes normalised). */
  function quoteCheck(quote, paragraphs) {
    if (!paragraphs || !paragraphs.length) return { status: "n/a", message: "No source document to check against" };
    const q = normalizeForQuote(quote);
    if (!q || q === UNCLEAR) return { status: "fail", message: "No quote given" };
    if (q.length < 15) return { status: "fail", message: "Quote is too short to identify the clause" };
    const doc = normalizeForQuote(documentText(paragraphs));
    if (!doc.includes(q)) return { status: "fail", message: "Quote does not appear word-for-word in the document" };
    const paras = paragraphs.map((p, i) => (normalizeForQuote(p).includes(q) ? i + 1 : null)).filter(Boolean);
    return { status: "pass", message: "Found word-for-word", paragraphs: paras };
  }

  function splitParagraphs(text) {
    const t = String(text || "").replace(/\r\n?/g, "\n").replace(/ /g, " ");
    let parts = t.split(/\n[ \t]*\n+/).map((s) => s.replace(/[ \t]*\n[ \t]*/g, " ").replace(/[ \t]+/g, " ").trim()).filter(Boolean);
    if (parts.length < 3) parts = t.split(/\n+/).map((s) => s.replace(/[ \t]+/g, " ").trim()).filter(Boolean);
    return parts;
  }

  /* ---- Terms ---- */
  const TERM_UNCLEAR_FIELDS = [
    ["vehicle", "Fund or vehicle"], ["conditions", "Conditions"], ["expiry", "Expiry or trigger"],
    ["grantBasis", "Grant basis"], ["mfnStatus", "MFN status"], ["obligation.is", "Ongoing obligation"], ["obligation.deadline", "Obligation deadline"],
    ["category", "Category"], ["summary", "Summary"],
  ];
  function getPath(o, p) { return p.split(".").reduce((a, k) => (a == null ? a : a[k]), o); }
  function unclearFields(t) {
    const out = [];
    for (const [p, label] of TERM_UNCLEAR_FIELDS) {
      if (p === "obligation.deadline" && getPath(t, "obligation.is") !== "yes") continue;
      const v = getPath(t, p);
      if (typeof v === "string" && v.trim().toLowerCase() === UNCLEAR) out.push({ field: p, label });
    }
    return out;
  }
  const isLive = (t) => t.status !== "rejected" && t.status !== "superseded";

  /* ---- Grant basis: why the fund gave a term. An array once set ([] = none); not an array = not set yet. ---- */
  const GRANT_BASES = [["size", "Commitment size"], ["closing", "Closing date"], ["lp_status", "LP status"], ["anchor", "Anchor package"]];
  const grantBasisLabel = (b) => (GRANT_BASES.find((x) => x[0] === b) || [b, b])[1];
  function grantBasesOf(t) { return Array.isArray(t.grantBasis) ? t.grantBasis : null; }
  function normGrantBases(v) {
    if (!Array.isArray(v)) return UNCLEAR;
    const ok = GRANT_BASES.map((x) => x[0]);
    return [...new Set(v.map((x) => String(x).trim().toLowerCase()).filter((x) => ok.includes(x)))];
  }
  /* A condition is anything other than an empty or "None" conditions field; "unclear" counts. */
  function hasCondition(t) { const c = String(t.conditions ?? "").trim(); return !!c && !/^(none|n\/a|null)$/i.test(c); }

  /* Flags that need a person to look. Computed, never stored, so they always reflect the current state. */
  function termFlags(t, letter) {
    const flags = [];
    if (letter && letter.source !== "manual") {
      const qc = quoteCheck(t.quote, letter.paragraphs);
      if (qc.status === "fail") flags.push({ type: "quote", message: qc.message });
    }
    if (!letter || letter.source === "manual" || t.origin === "manual") flags.push({ type: "manual", message: "Entered by hand: check against the signed letter" });
    if (t.mfnStatus !== "electable" && t.mfnStatus !== "excluded") flags.push({ type: "mfn", message: "MFN status must be set to electable or excluded" });
    else if (!String(t.mfnReason || "").trim()) flags.push({ type: "mfn", message: "MFN status needs a reason" });
    for (const u of unclearFields(t)) if (u.field !== "mfnStatus") flags.push({ type: "unclear", message: `${u.label} is unclear` });
    const pv = t.provenance || {};
    if (pv.model && pv.modelApplied && pv.model !== pv.modelApplied) flags.push({ type: "model", message: `Extracted by ${pv.modelApplied}, not the pinned model ${pv.model}` });
    if (pv.model && pv.modelApplied === null) flags.push({ type: "model", message: `The app could not confirm the pinned model ${pv.model} answered` });
    for (const iss of (letter?.secondPass?.issues || [])) if (!iss.resolved && iss.termId === t.id) flags.push({ type: "second", message: "Second-pass check: " + iss.problem });
    return flags;
  }

  /* Paragraph coverage: each paragraph must be cited by a live term or marked "no obligation". */
  function coverage(letter, terms) {
    const n = (letter.paragraphs || []).length;
    const cited = {}; for (let i = 1; i <= n; i++) cited[i] = [];
    for (const t of terms) if (t.letterId === letter.id && isLive(t)) for (const p of t.paragraphs || []) if (cited[p]) cited[p].push(t.id);
    const noObl = new Set(letter.noObligation || []);
    const rows = []; const unaccounted = [];
    for (let i = 1; i <= n; i++) {
      const state = cited[i].length ? "term" : noObl.has(i) ? "none" : "unaccounted";
      rows.push({ n: i, state, termIds: cited[i] });
      if (state === "unaccounted") unaccounted.push(i);
    }
    return { rows, unaccounted };
  }

  function letterFlags(letter, terms) {
    const out = [];
    if (letter.source === "manual") return out;
    for (const p of coverage(letter, terms).unaccounted) out.push({ type: "coverage", paragraph: p, message: `Paragraph ${p} is not linked to a term or marked "no obligation"` });
    for (const iss of letter.secondPass?.issues || []) if (!iss.resolved && !iss.termId) out.push({ type: "second", paragraph: iss.paragraph, message: "Second-pass check: " + iss.problem, issueId: iss.id });
    return out;
  }

  /* ---- Monitoring ---- */
  function metrics({ letters, terms, testRuns, config }) {
    const byLetter = Object.fromEntries(letters.map((l) => [l.id, l]));
    let flagged = 0, unclear = 0, modelFallbacks = 0;
    for (const t of terms) {
      if (!isLive(t)) continue;
      unclear += unclearFields(t).length;
      const pv = t.provenance || {};
      if (pv.model && pv.modelApplied !== undefined && pv.model !== pv.modelApplied) modelFallbacks++;
      if (t.status === "draft") flagged += termFlags(t, byLetter[t.letterId]).length;
    }
    for (const l of letters) if (l.status === "needs_review") flagged += letterFlags(l, terms).length;
    const failed = letters.filter((l) => l.status === "failed").length;
    const pinned = config?.model?.pinned;
    const runs = (testRuns || []).filter((r) => r.model === pinned && r.promptVersion === PROMPT_VERSIONS.extract && r.status === "complete").sort((a, b) => (a.at < b.at ? 1 : -1));
    const accuracy = runs[0] ? runs[0].accuracy : null;
    return { failed, flagged, unclear, accuracy, modelFallbacks, lastRun: runs[0] || null };
  }
  /* Alerts fire when a count goes up, or accuracy goes down, from the last acknowledged baseline. */
  function alertsFrom(m, baseline) {
    if (!baseline) return [];
    const a = [];
    if (m.failed > (baseline.failed ?? 0)) a.push({ key: "failed", message: `Failed extractions rose from ${baseline.failed ?? 0} to ${m.failed}` });
    if (m.flagged > (baseline.flagged ?? 0)) a.push({ key: "flagged", message: `Flagged items rose from ${baseline.flagged ?? 0} to ${m.flagged}` });
    if (m.unclear > (baseline.unclear ?? 0)) a.push({ key: "unclear", message: `Unclear fields rose from ${baseline.unclear ?? 0} to ${m.unclear}` });
    if (m.accuracy != null && baseline.accuracy != null && m.accuracy < baseline.accuracy) a.push({ key: "accuracy", message: `Test-set accuracy fell from ${pct(baseline.accuracy)} to ${pct(m.accuracy)}` });
    if (m.modelFallbacks > (baseline.modelFallbacks ?? 0)) a.push({ key: "model", message: `Terms extracted by a model other than the pinned one rose from ${baseline.modelFallbacks ?? 0} to ${m.modelFallbacks}` });
    return a;
  }
  const pct = (x) => (x == null ? "—" : (Math.round(x * 1000) / 10).toFixed(1) + "%");

  /* ---- MFN eligibility ----
     Can LP `elector` claim a term granted to LP `grantee`?
     returns {status: "eligible"|"not_eligible"|"review", reasons:[...]} */
  function mfnEligibility(elector, grantee, term, bundle) {
    const m = elector.mfn || {};
    if (!m.hasMfn) return { status: "not_eligible", reasons: ["Has no MFN clause"] };
    if (grantee && elector.id === grantee.id) return { status: "not_eligible", reasons: ["This is the LP that holds the term"] };
    if (term.mfnStatus === "excluded") return { status: "not_eligible", reasons: ["Term is marked excluded from MFN: " + (term.mfnReason || "no reason given")] };
    if ((m.excludedCategories || []).includes(term.category)) return { status: "not_eligible", reasons: [`This LP's MFN carve-out excludes the ${term.category} category`] };
    if ((m.excludedTermIds || []).includes(term.id)) return { status: "not_eligible", reasons: ["This LP's MFN excludes this specific term"] };
    const bases = grantBasesOf(term);
    const hit = (bases || []).filter((b) => (m.excludedGrantBases || []).includes(b));
    if (hit.length) return { status: "not_eligible", reasons: [`This LP's MFN carve-out excludes terms granted for ${hit.map(grantBasisLabel).join(" or ").toLowerCase()}`] };
    const reasons = []; const review = [];
    if (m.basis === "manual") review.push("MFN decided case by case" + (m.note ? ": " + m.note : ""));
    else if (m.basis === "all") reasons.push("MFN covers all LPs' terms");
    else {
      const limit = m.thresholdUsd != null ? m.thresholdUsd : elector.commitmentUsd;
      const gc = grantee ? grantee.commitmentUsd : null;
      if (gc == null) review.push("Holder's commitment is unknown");
      else if (gc > limit) return { status: "not_eligible", reasons: [`Holder committed ${usd(gc)}, above this LP's MFN limit of ${usd(limit)}`] };
      else reasons.push(`Holder committed ${usd(gc)}, within this LP's MFN limit of ${usd(limit)}${m.thresholdUsd != null ? " (custom threshold)" : " (its own commitment)"}`);
    }
    if (term.mfnStatus !== "electable") review.push("Term's MFN status is not set");
    if (!bases) review.push("Grant basis not set yet, so this LP's carve-outs can't be checked");
    if (hasCondition(term)) review.push("Condition to check against this LP: " + term.conditions);
    if (m.note && m.basis !== "manual") reasons.push("Note: " + m.note);
    if (bundle && bundle.allOrNothing) reasons.push(`Must elect the whole "${bundle.name}" bundle, including its conditions`);
    if (review.length) return { status: "review", reasons: [...review, ...reasons] };
    return { status: "eligible", reasons };
  }
  function usd(n) {
    if (n == null || isNaN(n)) return "—";
    if (n >= 1e9) return "$" + (n / 1e9).toFixed(n % 1e9 ? 2 : 0) + "B";
    if (n >= 1e6) return "$" + (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + "M";
    return "$" + Number(n).toLocaleString("en-US");
  }

  /* ---- Test set scoring ---- */
  function tokens(s) { return new Set(normalizeForQuote(s).toLowerCase().replace(/[^a-z0-9% ]/g, " ").split(/\s+/).filter((w) => w.length > 2)); }
  function quoteOverlap(a, b) {
    const na = normalizeForQuote(a).toLowerCase(), nb = normalizeForQuote(b).toLowerCase();
    if (!na || !nb) return 0;
    if (na.includes(nb) || nb.includes(na)) return 1;
    const ta = tokens(a), tb = tokens(b); let inter = 0;
    for (const w of ta) if (tb.has(w)) inter++;
    return inter / Math.max(1, Math.min(ta.size, tb.size));
  }
  /* expected: [{category, quote, mfnStatus, lpStatusBased}]; got: extracted terms. */
  function scoreCase(expected, got) {
    const used = new Set(); const rows = [];
    for (const ex of expected) {
      let best = -1, bestScore = 0;
      got.forEach((g, i) => { if (used.has(i)) return; const s = quoteOverlap(ex.quote, g.quote); if (s > bestScore) { bestScore = s; best = i; } });
      if (best < 0 || bestScore < 0.6) { rows.push({ expected: ex, result: "missed" }); continue; }
      used.add(best);
      const g = got[best]; const wrong = [];
      if (g.category !== ex.category) wrong.push(`category (${g.category} vs ${ex.category})`);
      if (g.mfnStatus !== ex.mfnStatus) wrong.push(`MFN status (${g.mfnStatus} vs ${ex.mfnStatus})`);
      const exLp = Array.isArray(ex.grantBasis) ? ex.grantBasis.includes("lp_status") : ex.lpStatusBased === "yes";
      const gLp = Array.isArray(g.grantBasis) && g.grantBasis.includes("lp_status");
      if (exLp !== gLp) wrong.push(`LP status grant basis (${gLp ? "yes" : "no"} vs ${exLp ? "yes" : "no"})`);
      rows.push({ expected: ex, result: wrong.length ? "wrong" : "correct", wrong, got: g });
    }
    const extra = got.filter((_, i) => !used.has(i));
    return { rows, extra, correct: rows.filter((r) => r.result === "correct").length, total: expected.length };
  }

  return { ZERO_HASH, PROMPT_VERSIONS, UNCLEAR, canon, sha256Bytes, sha256Text, auditBody, hashAuditEntry, auditId, verifyAuditChain,
    normalizeForQuote, documentText, quoteCheck, splitParagraphs, unclearFields, isLive, termFlags, coverage, letterFlags,
    metrics, alertsFrom, pct, mfnEligibility, usd, quoteOverlap, scoreCase, getPath,
    GRANT_BASES, grantBasisLabel, grantBasesOf, normGrantBases, hasCondition };
})();


/* ===== Runtime: capabilities, shared store, audit log, model calls, extraction pipeline ===== */
const C = CORE;
const RT = { db: null, user: null, sample: null, assets: null, downloads: null, meId: null, canWrite: null, tabId: "tab-" + Math.random().toString(36).slice(2, 10) };
const SEED_ACTOR = "seed";

const store = {
  state: {
    ready: {}, config: null, baseline: null, auditHead: null,
    lps: [], letters: [], terms: [], bundles: [], originals: [], elections: [], tests: [], testRuns: [], audit: [],
    all: { lps: [], letters: [], terms: [], elections: [] },
    names: { [SEED_ACTOR]: "Sample data" }, caps: { db: "loading", sample: "loading", assets: "loading", downloads: "loading", user: "loading" },
    integrity: {}, chain: null, toast: null, busy: null, slowNote: false, readOnly: false, testRun: null,
  },
  listeners: new Set(),
  set(patch) { this.state = { ...this.state, ...(typeof patch === "function" ? patch(this.state) : patch) }; this.listeners.forEach((l) => l()); },
};

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function rid(prefix) {
  const a = new Uint8Array(6); crypto.getRandomValues(a);
  return prefix + "-" + Date.now().toString(36) + "-" + Array.from(a).map((b) => (b % 36).toString(36)).join("");
}
function toast(kind, text) {
  store.set({ toast: { kind, text, at: Date.now() } });
  const at = store.state.toast.at; setTimeout(() => { if (store.state.toast?.at === at) store.set({ toast: null }); }, kind === "bad" ? 9000 : 4500);
}
function errText(e) {
  if (!e) return "Something went wrong";
  const code = e.code || "";
  const map = {
    not_granted: "Claude access was not allowed for this page. You can still enter terms by hand.",
    rate_limited: "Too many requests to Claude right now. Wait a minute and try again.",
    session_expired: "Your session expired. Sign in again, then retry.",
    sampling_disabled: "Claude is not available for this account.",
    prompt_too_large: "The document is too long to send in one request. Split it into shorter parts.",
    invalid_json: "Claude's reply could not be read as data. Try again.",
    refused: "Claude declined this request. Try different wording.",
    quota_exceeded: "The shared database is full. Delete old records before adding more.",
    invalid_argument: "The database refused this write. You may only have view access.",
  };
  return map[code] || e.message || String(e);
}

/* ---------- names ---------- */
const pendingNames = new Set(); let nameTimer = null;
function wantNames(ids) {
  const known = store.state.names;
  for (const id of ids) if (id && !(id in known) && id !== SEED_ACTOR) pendingNames.add(id);
  if (pendingNames.size && !nameTimer) nameTimer = setTimeout(async () => {
    nameTimer = null; const ids = [...pendingNames].slice(0, 64); ids.forEach((i) => pendingNames.delete(i));
    if (!RT.user) return;
    try {
      const ps = await RT.user.profiles(ids); const add = {};
      for (const id of ids) add[id] = (ps && ps[id] && ps[id].name) || "";
      store.set((s) => ({ names: { ...s.names, ...add } }));
    } catch { /* names stay blank */ }
  }, 50);
}
function nameOf(id) {
  if (!id) return "Unknown";
  if (id === SEED_ACTOR) return "Sample data";
  const n = store.state.names[id];
  if (n === undefined) { wantNames([id]); return "…"; }
  return (id === RT.meId ? (n || "You") + " (you)" : n || "Someone");
}

/* ---------- boot ---------- */
const COLLECTIONS = ["lps", "letters", "terms", "bundles", "originals", "elections", "tests", "testRuns", "audit"];
/* Archived records stay in the database but drop out of every working list. store.state.lps, .letters, .terms and
   .elections hold only active records; store.state.all holds everything, for the archive shelves and restore. */
const RAW = { lps: [], letters: [], terms: [], elections: [] };
function recomputeActive() {
  const lpOff = new Set(RAW.lps.filter((l) => l.archived).map((l) => l.id));
  const letterOff = new Set(RAW.letters.filter((l) => l.archived || lpOff.has(l.lpId)).map((l) => l.id));
  store.set({
    lps: RAW.lps.filter((l) => !l.archived),
    letters: RAW.letters.filter((l) => !letterOff.has(l.id)),
    terms: RAW.terms.filter((x) => !letterOff.has(x.letterId) && !lpOff.has(x.lpId)),
    elections: RAW.elections.filter((e) => !e.archived && !lpOff.has(e.lpId)),
    all: { lps: RAW.lps, letters: RAW.letters, terms: RAW.terms, elections: RAW.elections },
  });
}
async function boot() {
  const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const slow = setTimeout(() => store.set({ slowNote: true }), 10000);
  const [db, user, sample, assets, downloads] = await Promise.all([use("db"), use("user"), use("sample"), use("assets"), use("downloads")]);
  RT.db = db; RT.user = user; RT.sample = sample; RT.assets = assets; RT.downloads = downloads;
  store.set({ caps: { db: db ? "on" : "off", user: user ? "on" : "off", sample: sample ? "on" : "off", assets: assets ? "on" : "off", downloads: downloads ? "on" : "off" } });
  if (user) {
    try { const me = await user.me(); RT.meId = me.id; store.set((s) => ({ names: { ...s.names, ...(me.id ? { [me.id]: me.name || "" } : {}) } })); } catch {}
    try { RT.canWrite = await user.can("data.write"); } catch { RT.canWrite = null; }
    if (RT.canWrite === false) store.set({ readOnly: true });
  }
  if (!db) { clearTimeout(slow); store.set({ slowNote: true }); return; }
  const onErr = (what) => (e) => { if (e.code !== "unavailable") toast("bad", `Could not load ${what}: ${errText(e)}`); };
  const mark = (k) => { store.set((s) => ({ ready: { ...s.ready, [k]: true } })); if (["config", "lps", "letters", "terms"].every((x) => store.state.ready[x])) { clearTimeout(slow); store.set({ slowNote: false }); } };
  for (const col of COLLECTIONS) {
    db.collection(col).onSnapshot((snap) => {
      const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (col in RAW) { RAW[col] = list; recomputeActive(); } else store.set({ [col]: list });
      if (!snap.metadata.fromCache) mark(col);
      if (col === "audit") scheduleChainCheck();
    }, onErr(col));
  }
  db.doc("config/main").onSnapshot((d) => { store.set({ config: d.exists ? d.data() : null }); if (!d.metadata.fromCache) mark("config"); }, onErr("settings"));
  db.doc("monitor/baseline").onSnapshot((d) => store.set({ baseline: d.exists ? d.data() : null }), onErr("alert baseline"));
  db.doc("meta/auditHead").onSnapshot((d) => { store.set({ auditHead: d.exists ? d.data() : { seq: 0, hash: C.ZERO_HASH } }); scheduleChainCheck(); }, onErr("audit head"));
}

/* ---------- audit log (append-only by convention, hash-chained so edits and deletions are detectable) ---------- */
let auditQueue = Promise.resolve();
function appendAudit(action, entityType, entityId, summary, data) {
  const run = async () => {
    const head = RT.db.doc("meta/auditHead");
    let got = false;
    for (let i = 0; i < 40 && !got; i++) {
      const r = await head.acquire({ holder: RT.tabId, ttlMs: 4000 });
      if (r.acquired) got = true; else await sleep(150 + Math.random() * 350);
    }
    if (!got) throw new Error("The audit log is busy with another change. Your change was saved; try the action again to log it.");
    const snap = await head.get();
    const h = snap.exists ? snap.data() : { seq: 0, hash: C.ZERO_HASH };
    const e = { seq: (h.seq || 0) + 1, ts: new Date().toISOString(), actor: RT.meId || "unknown", action, entityType, entityId, summary, data: data == null ? null : JSON.parse(JSON.stringify(data)), prevHash: h.hash || C.ZERO_HASH };
    e.hash = await C.hashAuditEntry(e);
    await RT.db.doc("audit/" + C.auditId(e.seq)).set(e);
    await head.set({ seq: e.seq, hash: e.hash });
  };
  const p = auditQueue.then(run, run); auditQueue = p.catch(() => {}); return p;
}
let chainTimer = null;
function scheduleChainCheck() {
  clearTimeout(chainTimer);
  chainTimer = setTimeout(async () => {
    const s = store.state; if (!s.auditHead) return;
    const res = await C.verifyAuditChain(s.audit, s.auditHead);
    store.set({ chain: { ...res, at: new Date().toISOString() } });
  }, 400);
}

/* Manual re-check: re-reads every entry from the database instead of trusting the copy on screen. */
async function recheckChainFresh() {
  if (!RT.db) return;
  try {
    const [snap, head] = await Promise.all([RT.db.collection("audit").get(), RT.db.doc("meta/auditHead").get()]);
    const entries = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    const h = head.exists ? head.data() : { seq: 0, hash: C.ZERO_HASH };
    const res = await C.verifyAuditChain(entries, h);
    store.set({ audit: entries, auditHead: h, chain: { ...res, at: new Date().toISOString() } });
    toast(res.ok ? "ok" : "bad", res.ok ? `Audit log re-read: ${res.checked} entries, chain intact.` : `Audit log re-read: ${res.problems.length} problem${res.problems.length === 1 ? "" : "s"} found.`);
  } catch (e) { toast("bad", errText(e)); }
}

/* One user action = data writes, then one audit entry. */
async function act(label, fn) {
  if (!RT.db) { toast("bad", "The shared database is not available in this view."); return null; }
  if (store.state.readOnly) { toast("bad", "You have view-only access, so changes are turned off."); return null; }
  store.set({ busy: label });
  try { const r = await fn(); return r ?? true; }
  catch (e) { console.error(e); toast("bad", errText(e)); if (e && e.code === "invalid_argument") store.set({ readOnly: true }); return null; }
  finally { store.set({ busy: null }); }
}
const put = (path, data) => RT.db.doc(path).set(JSON.parse(JSON.stringify(data)));
const patch = (path, data) => RT.db.doc(path).update(JSON.parse(JSON.stringify(data)));

/* ---------- originals: stored once, verified by SHA-256 every time they are opened ---------- */
function bytesToB64(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToBytes(b64) { const s = atob(b64.trim()); const out = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; }

async function storeOriginal({ kind, file, bytes, text, letterId }) {
  const origId = "orig-" + letterId.slice(3);
  let doc, sha;
  if (kind === "paste") {
    sha = await C.sha256Text(text);
    doc = { letterId, filename: "Pasted text.txt", mime: "text/plain", storage: "inline-text", text, sha256: sha, sizeBytes: new TextEncoder().encode(text).length };
  } else {
    sha = await C.sha256Bytes(bytes);
    const isPdf = kind === "pdf";
    let stored = null;
    if (RT.assets) {
      try {
        const blob = isPdf ? new Blob([bytes], { type: "application/pdf" }) : new Blob([bytesToB64(bytes)], { type: "text/plain" });
        const up = await RT.assets.upload(blob, { type: isPdf ? "application/pdf" : "text/plain" });
        stored = { storage: isPdf ? "asset" : "asset-b64", assetId: up.id };
      } catch (e) { console.warn("asset upload failed", e); }
    }
    if (!stored) {
      const b64 = bytesToB64(bytes);
      if (b64.length > 230000) throw new Error("This file is too large to store without upload access (Editor). Ask the artifact owner for Editor access, or paste the text instead.");
      stored = { storage: "inline-b64", b64 };
    }
    doc = { letterId, filename: file.name, mime: file.type || (isPdf ? "application/pdf" : "application/vnd.openxmlformats-officedocument.wordprocessingml.document"), ...stored, sha256: sha, sizeBytes: bytes.length };
  }
  doc.createdAt = new Date().toISOString(); doc.createdBy = RT.meId || "unknown";
  await put("originals/" + origId, doc);
  await appendAudit("original.stored", "original", origId, `Stored original "${doc.filename}" (${doc.sizeBytes.toLocaleString()} bytes, read-only)`, { sha256: sha, letterId, storage: doc.storage });
  return { origId, sha, doc };
}

async function originalBytes(o) {
  if (o.storage === "inline-text") return new TextEncoder().encode(o.text || "");
  if (o.storage === "inline-b64") return b64ToBytes(o.b64 || "");
  const res = await fetch("/_blob/" + o.assetId);
  if (!res.ok) throw new Error("The stored file could not be fetched (" + res.status + ")");
  if (o.storage === "asset-b64") return b64ToBytes(await res.text());
  return new Uint8Array(await res.arrayBuffer());
}
/* Compares the file's hash now with (a) the hash saved with it and (b) the hash written to the audit log when it was stored. */
async function verifyOriginal(o) {
  const out = { at: new Date().toISOString(), stored: o.sha256, logged: null, computed: null, status: "checking" };
  store.set((s) => ({ integrity: { ...s.integrity, [o.id]: out } }));
  try {
    const bytes = await originalBytes(o);
    out.computed = await C.sha256Bytes(bytes);
    const entry = store.state.audit.find((e) => e.action === "original.stored" && e.entityId === o.id);
    out.logged = entry?.data?.sha256 || null;
    const chainOk = store.state.chain ? store.state.chain.bySeq?.[entry?.seq] !== "broken" : true;
    if (out.computed !== o.sha256) { out.status = "mismatch"; out.message = "The file's contents no longer match the hash saved when it was stored."; }
    else if (!out.logged) { out.status = "mismatch"; out.message = "No audit log entry records this file being stored."; }
    else if (out.logged !== out.computed) { out.status = "mismatch"; out.message = "The hash in the audit log differs from the file's current hash."; }
    else if (!chainOk) { out.status = "mismatch"; out.message = "The audit log entry for this file fails the chain check."; }
    else { out.status = "ok"; out.message = "Matches the hash saved with it and the hash in the audit log."; }
  } catch (e) { out.status = "error"; out.message = errText(e); }
  store.set((s) => ({ integrity: { ...s.integrity, [o.id]: { ...out } } }));
  return out;
}

/* ---------- reading files ---------- */
const LIB = {
  mammoth: "https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js",
  pdfWorker: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js",
  pdf: "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",
};
const loaded = {};
function loadScript(url) {
  if (!loaded[url]) loaded[url] = new Promise((res, rej) => { const s = document.createElement("script"); s.src = url; s.onload = res; s.onerror = () => rej(new Error("Could not load a file reader library. Check your connection and retry.")); document.head.appendChild(s); });
  return loaded[url];
}
async function docxToText(bytes) {
  await loadScript(LIB.mammoth);
  const r = await window.mammoth.extractRawText({ arrayBuffer: bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength) });
  return r.value;
}
async function pdfToText(bytes) {
  await loadScript(LIB.pdfWorker); await loadScript(LIB.pdf); // worker script runs on the main thread (no cross-origin worker needed)
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
  const pdf = await lib.getDocument({ data: bytes.slice(), isEvalSupported: false }).promise;
  const out = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p); const tc = await page.getTextContent();
    const lines = []; let cur = null;
    for (const it of tc.items) {
      if (!("str" in it)) continue;
      const y = it.transform[5], hgt = Math.abs(it.transform[3]) || it.height || 10;
      if (!cur || Math.abs(cur.y - y) > hgt * 0.5) { cur = { y, h: hgt, text: "" }; lines.push(cur); }
      cur.text += (cur.text && !cur.text.endsWith(" ") && !it.str.startsWith(" ") ? " " : "") + it.str;
    }
    const gaps = []; for (let i = 1; i < lines.length; i++) gaps.push(Math.abs(lines[i - 1].y - lines[i].y));
    const med = gaps.length ? [...gaps].sort((a, b) => a - b)[Math.floor(gaps.length / 2)] : 0;
    let text = "";
    lines.forEach((l, i) => { if (i > 0) text += gaps[i - 1] > med * 1.4 ? "\n\n" : "\n"; text += l.text.trim(); });
    out.push(text);
  }
  return out.join("\n\n");
}

/* ---------- model calls: every call names the pinned model, and records which model answered ---------- */
function parseJson(text) {
  let t = String(text || "").trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) t = fence[1].trim();
  try { return JSON.parse(t); } catch {}
  const s = t.search(/[\[{]/), e = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (s >= 0 && e > s) { try { return JSON.parse(t.slice(s, e + 1)); } catch {} }
  const err = new Error("Claude's reply could not be read as data. Try again."); err.code = "invalid_json"; throw err;
}
async function callModel(prompt, { model, signal } = {}) {
  if (!RT.sample) { const e = new Error("Claude is not available in this view, so extraction and plain-English search are off. You can still enter terms by hand and use the filters."); e.code = "no_sample"; throw e; }
  const pinned = model || store.state.config?.model?.pinned;
  if (!pinned) throw new Error("No pinned model is set. Set one under Quality.");
  const res = await RT.sample(prompt, { model: pinned, modelTier: "default", cache: false, signal });
  if (res.truncated) { const e = new Error("Claude's answer was cut short. Try a shorter document."); e.code = "truncated"; throw e; }
  return { json: parseJson(res.text), model: pinned, modelApplied: res.modelApplied ?? null };
}

function categoryList() { return store.state.config?.categories || []; }
function catName(id) { if (id === C.UNCLEAR) return "Unclear"; return categoryList().find((c) => c.id === id)?.name || id; }
const LP_TYPES = { public_pension: "Public pension", sovereign: "Sovereign wealth fund", erisa: "Corporate (ERISA) plan", insurance: "Insurance company", endowment: "Endowment", foundation: "Foundation", fund_of_funds: "Fund of funds", family_office: "Family office", other: "Other" };

function extractionPrompt(paragraphs, ctx) {
  const cats = categoryList().map((c) => `${c.id} = ${c.name}`).join("; ");
  const fund = store.state.config?.fund || {};
  return `You extract obligations from one side letter of a private infrastructure fund (${fund.name || "the Fund"}) for a side-letter tracking system used by the fund's team and outside counsel. A wrong answer is worse than "unclear": never guess.

Investor (LP): ${ctx.lpName} (${LP_TYPES[ctx.lpType] || ctx.lpType}). Vehicle: ${ctx.vehicle}. Standard management fee under the Partnership Agreement: ${fund.standardFeePct ?? 1.5}% per year. MFN clause: ${fund.mfnSection || "Section 14.9"}.
Category ids: ${cats}; use "unclear" only if no category fits.

Side letter, numbered paragraphs:
${paragraphs.map((p, i) => `[${i + 1}] ${p}`).join("\n")}

Reply with only one JSON object, no prose:
{"terms":[{"category":"<category id>","summary":"one plain-English sentence","quote":"text copied character-for-character from the letter","paragraphs":[<paragraph numbers this term relies on>],"vehicle":"<vehicle the term applies to>","conditions":"conditions the benefit depends on, or None","expiry":"end date or trigger, or None","grantBasis":["size"|"closing"|"lp_status"|"anchor", ...] or "unclear","mfnStatus":"electable|excluded|unclear","mfnReason":"short reason","obligation":{"is":"yes|no|unclear","deadline":"frequency or deadline if yes, else empty"},"feeRatePct":<number or null>,"carryPct":<number or null>,"bundleKey":"<key shared by terms granted together, or null>"}],
"noObligationParagraphs":[<paragraph numbers with no right or obligation, e.g. recitals, governing law>],
"bundles":[{"key":"<bundleKey>","name":"short name","allOrNothing":true,"reason":"why these go together"}]}

Rules:
1. Every paragraph number from 1 to ${paragraphs.length} must appear in some term's "paragraphs" or in "noObligationParagraphs". A paragraph can support several terms.
2. "quote" must be an exact, contiguous copy of the letter's words (at least 15 characters, ideally one sentence). Do not paraphrase or fix typos.
3. Any field you cannot determine from the text is the string "unclear". Do not guess.
4. grantBasis lists why the fund gave the term: "size" (tied to the size of the investor's commitment), "closing" (tied to when the investor was admitted, such as the first or initial closing), "lp_status" (exists because of what the investor legally is: public-records laws, sovereign immunity, ERISA plan assets, insurance regulation, fund-of-funds look-through, state investment policies), "anchor" (granted as part of an anchor or cornerstone package). Use [] when none applies; several can apply.
5. mfnStatus: "excluded" for terms whose grantBasis includes lp_status, for the MFN right itself, and for anything the letter says may not be elected; otherwise "electable" if another LP could claim it through an MFN clause. Always give mfnReason.
6. feeRatePct: the investor's resulting annual management fee rate in percent when the term sets or changes it (a 0.10% reduction from ${fund.standardFeePct ?? 1.5}% is ${((fund.standardFeePct ?? 1.5) - 0.1).toFixed(2)}); otherwise null. carryPct likewise for carried interest.
7. Use bundleKey when the letter grants terms together, or ties a benefit to a condition or obligation in another paragraph that an electing LP would also have to accept. Set allOrNothing true when they cannot be elected separately.
8. vehicle is "${ctx.vehicle}" unless the clause limits the term to a different vehicle.`;
}

function normalizeTerm(raw, paragraphs, ctx) {
  const lc = (v) => String(v ?? "").trim().toLowerCase();
  const pick = (v, opts) => (opts.includes(lc(v)) ? lc(v) : C.UNCLEAR);
  const str = (v) => { const s = String(v ?? "").trim(); return s ? (lc(s) === C.UNCLEAR ? C.UNCLEAR : s) : C.UNCLEAR; };
  const optStr = (v) => { const s = String(v ?? "").trim(); if (!s || /^(none|n\/a|null)$/i.test(s)) return "None"; return lc(s) === C.UNCLEAR ? C.UNCLEAR : s; };
  const catIds = categoryList().map((c) => c.id);
  const n = paragraphs.length;
  let paras = Array.isArray(raw.paragraphs) ? raw.paragraphs.map(Number).filter((x) => Number.isInteger(x) && x >= 1 && x <= n) : [];
  if (!paras.length) { const qc = C.quoteCheck(raw.quote, paragraphs); if (qc.paragraphs) paras = qc.paragraphs; }
  const num = (v) => (v === null || v === undefined || v === "" || isNaN(Number(v)) ? null : Number(v));
  const ob = raw.obligation || {};
  return {
    category: catIds.includes(lc(raw.category)) ? lc(raw.category) : C.UNCLEAR,
    summary: str(raw.summary), quote: String(raw.quote ?? "").trim(), paragraphs: [...new Set(paras)].sort((a, b) => a - b),
    vehicle: raw.vehicle ? str(raw.vehicle) : ctx.vehicle, conditions: optStr(raw.conditions), expiry: optStr(raw.expiry),
    grantBasis: C.normGrantBases(raw.grantBasis), mfnStatus: pick(raw.mfnStatus, ["electable", "excluded"]), mfnReason: String(raw.mfnReason ?? "").trim(),
    obligation: { is: pick(ob.is, ["yes", "no"]), deadline: String(ob.deadline ?? "").trim() || (lc(ob.is) === "yes" ? C.UNCLEAR : "") },
    feeRatePct: num(raw.feeRatePct), carryPct: num(raw.carryPct), bundleKey: raw.bundleKey ? String(raw.bundleKey) : null,
  };
}

async function extractTerms(paragraphs, ctx, { model, signal } = {}) {
  const r = await callModel(extractionPrompt(paragraphs, ctx), { model, signal });
  const j = r.json || {};
  const terms = (Array.isArray(j.terms) ? j.terms : []).map((t) => normalizeTerm(t, paragraphs, ctx));
  const n = paragraphs.length;
  const noObligation = (Array.isArray(j.noObligationParagraphs) ? j.noObligationParagraphs : []).map(Number).filter((x) => Number.isInteger(x) && x >= 1 && x <= n);
  const bundles = (Array.isArray(j.bundles) ? j.bundles : []).filter((b) => b && b.key).map((b) => ({ key: String(b.key), name: String(b.name || "Bundle"), allOrNothing: b.allOrNothing !== false, reason: String(b.reason || "") }));
  return { terms, noObligation: [...new Set(noObligation)], bundles, model: r.model, modelApplied: r.modelApplied };
}

async function secondPassCheck(paragraphs, terms, ctx, { model, signal } = {}) {
  const prompt = `You are a second, independent reviewer checking another reviewer's extraction of a private infrastructure fund side letter for ${ctx.lpName}. Report only real problems; if the extraction is right, return an empty list.

Side letter, numbered paragraphs:
${paragraphs.map((p, i) => `[${i + 1}] ${p}`).join("\n")}

Extracted terms (index: fields):
${terms.map((t, i) => `${i}: ${JSON.stringify({ category: t.category, summary: t.summary, quote: t.quote, paragraphs: t.paragraphs, conditions: t.conditions, expiry: t.expiry, grantBasis: t.grantBasis, mfnStatus: t.mfnStatus, obligation: t.obligation, feeRatePct: t.feeRatePct })}`).join("\n")}

Look for: rights or obligations in the letter that no term captures; wrong category; conditions, expiry dates or triggers that were missed; wrong MFN status or grant basis; wrong fee rate; misread deadlines. The fund's standard management fee is ${store.state.config?.fund?.standardFeePct ?? 1.5}% per year, so a resulting rate computed from it is supported.

Reply with only JSON: {"issues":[{"paragraph":<number or null>,"termIndex":<index or null>,"field":"<field name or null>","severity":"high|medium|low","problem":"one sentence"}]}`;
  const r = await callModel(prompt, { model, signal });
  const issues = (Array.isArray(r.json?.issues) ? r.json.issues : []).map((x) => ({
    paragraph: Number.isInteger(Number(x.paragraph)) ? Number(x.paragraph) : null, termIndex: Number.isInteger(Number(x.termIndex)) && x.termIndex !== null ? Number(x.termIndex) : null,
    field: x.field ? String(x.field) : null, severity: ["high", "medium", "low"].includes(x.severity) ? x.severity : "medium", problem: String(x.problem || "").trim(),
  })).filter((x) => x.problem);
  return { issues, model: r.model, modelApplied: r.modelApplied };
}

/* Reads the facts the LP record must match (B3) and drafts the LP's MFN carve-outs from its MFN clause (B1).
   Results wait on the letter for the reviewer: facts are compared at review, the MFN draft must be confirmed. */
async function readLetterFacts(letterId, { signal } = {}) {
  const s = store.state; const letter = s.all.letters.find((l) => l.id === letterId); const lp = s.all.lps.find((l) => l.id === letter.lpId);
  const cats = categoryList().map((c) => `${c.id} = ${c.name}`).join("; ");
  const prompt = `Read this side letter of a private infrastructure fund and report (a) facts about the investor and (b) what the investor's MFN (most favored nation) clause lets it claim. A wrong answer is worse than null: never guess.

Side letter, numbered paragraphs:
${letter.paragraphs.map((p, i) => `[${i + 1}] ${p}`).join("\n")}

Category ids: ${cats}
Grant bases: size (terms tied to commitment size), closing (terms tied to when an investor was admitted), lp_status (terms that exist because of an investor's legal or regulatory status), anchor (anchor or cornerstone packages).

Reply with only JSON:
{"facts":{"legalName":"investor's full legal name as written, or null","commitmentUsd":<investor's capital commitment in US dollars as a number, or null if the letter does not state it>,"letterDate":"YYYY-MM-DD date the letter is dated, or null","closing":"the closing the letter says the investor was admitted at (e.g. Initial Closing), or null"},
"mfn":{"hasMfn":true|false,"paragraphs":[<MFN paragraph numbers>],"basis":"size|all|manual","thresholdUsd":<number or null>,"excludedCategories":[<category ids the clause carves out>],"excludedGrantBases":[<grant bases the clause carves out>],"note":"one sentence on anything else the clause limits, or empty","quote":"the carve-out text copied exactly, or empty"}}
basis "size" = terms granted to LPs with commitments equal to or smaller than this investor's; "all" = any LP's terms; "manual" = the clause leaves it to case-by-case decisions or counsel confirmation. Use excludedCategories only when the clause carves out a whole kind of term (such as advisory committee seats or co-investment rights) and excludedGrantBases when it carves out terms by why they were granted (such as fee reductions for commitment size or early closings, or terms based on another LP's legal status).`;
  const r = await callModel(prompt, { signal });
  const f = r.json?.facts || {}; const m = r.json?.mfn || {};
  const num = (v) => (v === null || v === undefined || v === "" || isNaN(Number(v)) ? null : Number(v));
  const str = (v) => (v == null || !String(v).trim() || /^(null|unclear)$/i.test(String(v).trim()) ? null : String(v).trim());
  const date = (v) => (/^\d{4}-\d{2}-\d{2}$/.test(String(v || "")) ? String(v) : null);
  const catIds = categoryList().map((c) => c.id);
  const facts = { legalName: str(f.legalName), commitmentUsd: num(f.commitmentUsd), letterDate: date(f.letterDate), closing: str(f.closing), model: r.model, modelApplied: r.modelApplied, at: new Date().toISOString(), by: RT.meId };
  const bases = C.normGrantBases(m.excludedGrantBases);
  const mfnProposal = { hasMfn: m.hasMfn === true, paragraphs: (Array.isArray(m.paragraphs) ? m.paragraphs : []).map(Number).filter((x) => Number.isInteger(x)),
    basis: ["size", "all", "manual"].includes(m.basis) ? m.basis : "size", thresholdUsd: num(m.thresholdUsd),
    excludedCategories: (Array.isArray(m.excludedCategories) ? m.excludedCategories : []).map(String).filter((x) => catIds.includes(x)),
    excludedGrantBases: Array.isArray(bases) ? bases : [], note: String(m.note || "").trim(), quote: String(m.quote || "").trim(),
    confirmed: false, model: r.model, modelApplied: r.modelApplied, at: facts.at };
  await patch("letters/" + letterId, { facts, mfnProposal, factChecks: {} });
  await appendAudit("letter.facts_read", "letter", letterId, `Read letter facts and MFN clause for ${lp?.name || "the LP"}: commitment ${facts.commitmentUsd != null ? C.usd(facts.commitmentUsd) : "not stated"}, MFN ${mfnProposal.hasMfn ? "found" : "not found"}`, { facts, mfnProposal });
  return { facts, mfnProposal };
}

/* Full pipeline for a stored letter: extract -> quote + coverage checks -> second pass -> facts and MFN clause -> ready for review. */
async function runExtraction(letterId, { onStep, signal } = {}) {
  const s = store.state; const letter = s.letters.find((l) => l.id === letterId); const lp = s.lps.find((l) => l.id === letter.lpId);
  const ctx = { lpName: lp?.name || "the Investor", lpType: lp?.type || "other", vehicle: letter.vehicle };
  const step = (k, st, text) => onStep && onStep(k, st, text);
  const pinned = s.config.model.pinned;
  await patch("letters/" + letterId, { status: "extracting", extraction: { model: pinned, promptVersion: C.PROMPT_VERSIONS.extract, startedAt: new Date().toISOString(), by: RT.meId } });
  let ex;
  try {
    step("extract", "run", `Reading the letter with ${pinned}…`);
    ex = await extractTerms(letter.paragraphs, ctx, { signal });
  } catch (e) {
    const msg = errText(e);
    await patch("letters/" + letterId, { status: "failed", extraction: { model: pinned, promptVersion: C.PROMPT_VERSIONS.extract, at: new Date().toISOString(), by: RT.meId, error: msg } });
    await appendAudit("extraction.failed", "letter", letterId, `Extraction failed for ${ctx.lpName}: ${msg}`, { model: pinned, promptVersion: C.PROMPT_VERSIONS.extract, error: msg });
    step("extract", "bad", msg); throw e;
  }
  const at = new Date().toISOString();
  const fallback = ex.modelApplied !== pinned;
  step("extract", fallback ? "warn" : "ok", `${ex.terms.length} terms found${fallback ? ` · answered by ${ex.modelApplied || "an unconfirmed model"}, not ${pinned}` : ` by ${pinned}`}`);
  // bundles
  const bundleIdByKey = {};
  for (const b of ex.bundles) {
    const members = ex.terms.filter((t) => t.bundleKey === b.key); if (members.length < 2) continue;
    bundleIdByKey[b.key] = rid("bnd");
  }
  const termIds = ex.terms.map(() => rid("t"));
  const prov = { model: pinned, modelApplied: ex.modelApplied, promptVersion: C.PROMPT_VERSIONS.extract, extractedAt: at, extractedBy: RT.meId, approvedBy: null, approvedAt: null };
  for (let i = 0; i < ex.terms.length; i++) {
    const t = ex.terms[i]; const { bundleKey, ...rest } = t;
    await put("terms/" + termIds[i], { ...rest, letterId, lpId: letter.lpId, bundleId: bundleIdByKey[bundleKey] || null, status: "draft", origin: "extracted", provenance: prov });
  }
  for (const b of ex.bundles) {
    const id = bundleIdByKey[b.key]; if (!id) continue;
    await put("bundles/" + id, { name: b.name, lpId: letter.lpId, termIds: ex.terms.map((t, i) => (t.bundleKey === b.key ? termIds[i] : null)).filter(Boolean), allOrNothing: b.allOrNothing, note: b.reason, createdBy: RT.meId, createdAt: at });
  }
  const quoteFails = ex.terms.filter((t) => C.quoteCheck(t.quote, letter.paragraphs).status !== "pass").length;
  const fakeLetter = { ...letter, noObligation: ex.noObligation };
  const cov = C.coverage(fakeLetter, ex.terms.map((t, i) => ({ ...t, id: termIds[i], letterId, status: "draft" })));
  step("quote", quoteFails ? "warn" : "ok", quoteFails ? `${quoteFails} of ${ex.terms.length} quotes not found word-for-word (flagged)` : `All ${ex.terms.length} quotes found word-for-word`);
  step("coverage", cov.unaccounted.length ? "warn" : "ok", cov.unaccounted.length ? `${cov.unaccounted.length === 1 ? "Paragraph" : "Paragraphs"} ${cov.unaccounted.join(", ")} not linked to any term (flagged)` : `All ${letter.paragraphs.length} paragraphs accounted for`);
  await patch("letters/" + letterId, { status: "needs_review", noObligation: ex.noObligation, extraction: { model: pinned, modelApplied: ex.modelApplied, promptVersion: C.PROMPT_VERSIONS.extract, at, by: RT.meId } });
  await appendAudit("extraction.completed", "letter", letterId, `Extracted ${ex.terms.length} draft terms for ${ctx.lpName}; ${quoteFails} quote failures, ${cov.unaccounted.length} unaccounted paragraphs`,
    { model: pinned, modelApplied: ex.modelApplied, promptVersion: C.PROMPT_VERSIONS.extract, termIds, bundles: Object.values(bundleIdByKey), quoteFails, unaccounted: cov.unaccounted });
  // second pass
  try {
    step("second", "run", "Second pass: rereading the letter against the extracted terms…");
    const sp = await secondPassCheck(letter.paragraphs, ex.terms, ctx, { signal });
    const issues = sp.issues.map((x) => ({ id: rid("iss"), paragraph: x.paragraph, termId: x.termIndex != null && termIds[x.termIndex] ? termIds[x.termIndex] : null, field: x.field, severity: x.severity, problem: x.problem, resolved: false }));
    await patch("letters/" + letterId, { secondPass: { at: new Date().toISOString(), model: pinned, modelApplied: sp.modelApplied, promptVersion: C.PROMPT_VERSIONS.verify, issues } });
    await appendAudit("secondpass.completed", "letter", letterId, `Second-pass check found ${issues.length} disagreement${issues.length === 1 ? "" : "s"}`, { model: pinned, modelApplied: sp.modelApplied, promptVersion: C.PROMPT_VERSIONS.verify, issues: issues.map((i) => ({ id: i.id, paragraph: i.paragraph, termId: i.termId, problem: i.problem })) });
    step("second", issues.length ? "warn" : "ok", issues.length ? `${issues.length} disagreement${issues.length === 1 ? "" : "s"} to review` : "No disagreements found");
  } catch (e) {
    const msg = errText(e);
    const issues = [{ id: rid("iss"), paragraph: null, termId: null, field: null, severity: "high", problem: "The second-pass check could not run (" + msg + "). Review this letter line by line.", resolved: false }];
    await patch("letters/" + letterId, { secondPass: { at: new Date().toISOString(), model: pinned, modelApplied: null, promptVersion: C.PROMPT_VERSIONS.verify, issues, error: msg } });
    await appendAudit("secondpass.failed", "letter", letterId, "Second-pass check failed: " + msg, { error: msg });
    step("second", "bad", "Second pass failed: " + msg + " (flagged for line-by-line review)");
  }
  try {
    step("facts", "run", "Reading the commitment, legal name, date, closing and MFN clause…");
    const fr = await readLetterFacts(letterId, { signal });
    step("facts", "ok", `Letter facts read; MFN clause ${fr.mfnProposal.hasMfn ? "found, carve-outs drafted for review" : "not found"}`);
  } catch (e) { step("facts", "bad", "Could not read the letter facts: " + errText(e) + " (run it again from the review screen)"); }
  return { termIds };
}

const fmtDate = (iso) => { if (!iso) return "—"; const d = new Date(iso.length === 10 ? iso + "T12:00:00" : iso); return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }); };

function Pill({ kind = "neutral", children, title }) { return html`<span class=${"pill pill-" + kind} title=${title || ""}>${children}</span>`; }
function StatusPill({ status }) {

function MfnPill({ v }) { return v === "electable" ? html`<${Pill} kind="info">MFN electable<//>` : v === "excluded" ? html`<${Pill} kind="neutral">MFN excluded<//>` : html`<${Pill} kind="warn">MFN unclear<//>`; }
function Clause({ text, n }) { return html`<blockquote class="clause">${n ? html`<span class="pmark">¶ ${Array.isArray(n) ? n.join(", ") : n}</span>` : null}${text}</blockquote>`; }
function Empty({ title, children }) { return html`<div class="empty"><strong>${title}</strong>${children ? html`<div>${children}</div>` : null}</div>`; }
function Field({ label, hint, children, wide }) { return html`<label class=${"field" + (wide ? " wide" : "")}><span class="flabel">${label}</span>${children}${hint ? html`<span class="fhint">${hint}</span>` : null}</label>`; }
function Seg({ value, options, onChange, disabled }) {
  return html`<div class="seg" role="group">${options.map(([v, l]) => html`<button type="button" class=${value === v ? "on" : ""} disabled=${disabled} onClick=${() => onChange(v)}>${l}</button>`)}</div>`;

const grantBasisText = (x) => { const b = C.grantBasesOf(x); return b == null ? "Not set" : b.length ? b.map(C.grantBasisLabel).join(", ") : "None"; };
function GrantBasisField({ value, onChange, id }) {
  const set = Array.isArray(value);
  return html`<div class="gb"><${Toggles} values=${set ? value : []} options=${C.GRANT_BASES} onChange=${(v) => onChange(v)} />
    <span class="check"><input id=${id} type="checkbox" checked=${set && !value.length} onChange=${(e) => onChange(e.target.checked ? [] : C.UNCLEAR)} /> None of these</span>
    ${!set ? html`<span class="fhint">Not set yet</span>` : null}</div>`;
}
function Toggles({ values, options, onChange }) {
  const set = new Set(values || []);
  return html`<div class="toggles">${options.map(([v, l]) => html`<button type="button" class=${set.has(v) ? "on" : ""} onClick=${() => { const n = new Set(set); n.has(v) ? n.delete(v) : n.add(v); onChange([...n]); }}>${l}</button>`)}</div>`;
}
function Highlight({ text, words }) {
  if (!words || !words.length) return text;
  const esc = words.filter(Boolean).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).sort((a, b) => b.length - a.length);
  if (!esc.length) return text;
  const re = new RegExp("(" + esc.join("|") + ")", "gi");
  return String(text).split(re).map((part, i) => (i % 2 ? html`<mark>${part}</mark>` : part));
}
function Provenance({ t }) {
  const p = t.provenance || {};
  const fallback = p.model && p.modelApplied !== undefined && p.model !== p.modelApplied;
  return html`<div class="prov">
    <span>Extracted by <code>${p.modelApplied === null ? "unconfirmed model" : p.modelApplied || "—"}</code>${fallback ? html` <${Pill} kind="bad">pinned: ${p.model}<//>` : null}</span>

    <span>${p.approvedBy ? html`Approved by ${nameOf(p.approvedBy)}, ${fmtTime(p.approvedAt)}` : "Not approved"}</span>

}

/* A compact, read-only term card (search results, letter detail, MFN) */

  const s = store.state;
  const bundle = t.bundleId ? s.bundles.find((b) => b.id === t.bundleId) : null;
  const siblings = bundle ? s.terms.filter((x) => bundle.termIds.includes(x.id) && x.id !== t.id) : [];

      <${MfnPill} v=${t.mfnStatus} />
      ${t.status !== "approved" ? html`<${StatusPill} status=${t.status} />` : null}
      ${t.feeRatePct != null ? html`<span class="num">${pctFee(t.feeRatePct)} <span class="muted">(${bp(t.feeRatePct)})</span></span>` : null}
    </header>
    <p class="summary"><${Highlight} text=${t.summary} words=${words} /></p>
    <${Clause} text=${html`<${Highlight} text=${t.quote} words=${words} />`} n=${t.paragraphs} />
    <dl class="facts">
      <div><dt>Vehicle</dt><dd>${t.vehicle}</dd></div>
      <div><dt>Conditions</dt><dd>${t.conditions}</dd></div>
