      <div><dt>Ongoing obligation</dt><dd>${t.obligation?.is === "yes" ? t.obligation.deadline || "Yes" : t.obligation?.is === "no" ? "No" : "Unclear"}</dd></div>
      <div><dt>MFN reason</dt><dd>${t.mfnReason || "—"}</dd></div>
      <div><dt>Granted for</dt><dd>${grantBasisText(t)}</dd></div>
    </dl>
    ${bundle ? html`<div class="bundle-box">
      <div><strong>Bundle: ${bundle.name}</strong> ${bundle.allOrNothing ? html`<${Pill} kind="warn">all-or-nothing<//>` : html`<${Pill} kind="neutral">can be elected separately<//>`}</div>
      ${bundle.note ? html`<p class="muted">${bundle.note}</p>` : null}
      <ul>${siblings.map((x) => html`<li><${Pill} kind="cat">${catName(x.category)}<//> ${x.summary}</li>`)}</ul>
    </div>` : null}
    ${extra || null}
  </article>`;
}

/* ---------------- Search ---------------- */
const emptyFilter = () => ({ categories: [], lpIds: [], lpTypes: [], vehicles: [], mfnStatus: [], grantBasis: [], obligation: [], feeBelow: null, feeAbove: null, hasExpiry: null, inBundle: null, text: "", includeDrafts: false, includeSuperseded: false });
function applyFilter(f, s) {
  const lpById = Object.fromEntries(s.lps.map((l) => [l.id, l]));
  const text = (f.text || "").trim().toLowerCase();
  return s.terms.filter((t) => {
    if (t.status === "rejected") return false;
    if (t.status === "superseded" && !f.includeSuperseded) return false;
    if (t.status === "draft" && !f.includeDrafts) return false;
    if (f.categories?.length && !f.categories.includes(t.category)) return false;
    if (f.lpIds?.length && !f.lpIds.includes(t.lpId)) return false;
    if (f.lpTypes?.length && !f.lpTypes.includes(lpById[t.lpId]?.type)) return false;
    if (f.vehicles?.length && !f.vehicles.includes(t.vehicle)) return false;
    if (f.mfnStatus?.length && !f.mfnStatus.includes(t.mfnStatus)) return false;
    if (f.grantBasis?.length) {
      const b = C.grantBasesOf(t) ?? (t.lpStatusBased === "yes" ? ["lp_status"] : []);
      if (!f.grantBasis.some((x) => b.includes(x))) return false;
    }
    if (f.obligation?.length && !f.obligation.includes(t.obligation?.is)) return false;
    if (f.feeBelow != null && !(t.feeRatePct != null && t.feeRatePct < f.feeBelow)) return false;
    if (f.feeAbove != null && !(t.feeRatePct != null && t.feeRatePct > f.feeAbove)) return false;
    if (f.hasExpiry === true && (t.expiry === "None" || !t.expiry)) return false;
    if (f.hasExpiry === false && t.expiry && t.expiry !== "None") return false;
    if (f.inBundle === true && !t.bundleId) return false;
    if (f.inBundle === false && t.bundleId) return false;
    if (text && !(t.summary + " " + t.quote + " " + t.conditions + " " + t.expiry + " " + (t.obligation?.deadline || "")).toLowerCase().includes(text)) return false;
    return true;
  }).sort((a, b) => lpName(a.lpId).localeCompare(lpName(b.lpId)) || catName(a.category).localeCompare(catName(b.category)));
}
function describeFilter(f) {
  const out = [];
  const list = (arr, fn) => arr.map(fn).join(" or ");
  out.push(f.includeDrafts ? "Approved and draft terms" : "Approved terms only");
  if (f.categories?.length) out.push("Category is " + list(f.categories, catName));
  if (f.lpIds?.length) out.push("LP is " + list(f.lpIds, lpName));
  if (f.lpTypes?.length) out.push("LP type is " + list(f.lpTypes, (x) => LP_TYPES[x] || x));
  if (f.vehicles?.length) out.push("Vehicle is " + f.vehicles.join(" or "));
  if (f.mfnStatus?.length) out.push("MFN status is " + f.mfnStatus.join(" or "));
  if (f.grantBasis?.length) out.push("Granted for " + f.grantBasis.map(C.grantBasisLabel).join(" or ").toLowerCase());
  if (f.obligation?.length) out.push("Ongoing obligation is " + f.obligation.join(" or "));
  if (f.feeBelow != null) out.push(`Fee rate below ${f.feeBelow}%`);
  if (f.feeAbove != null) out.push(`Fee rate above ${f.feeAbove}%`);
  if (f.hasExpiry != null) out.push(f.hasExpiry ? "Has an expiry or trigger" : "No expiry");
  if (f.inBundle != null) out.push(f.inBundle ? "Part of a bundle" : "Not in a bundle");
  if (f.text) out.push(`Text contains "${f.text}"`);
  if (f.includeSuperseded) out.push("Includes superseded terms");
  return out;
}
function sanitizeFilter(raw) {
  const f = emptyFilter(); const s = store.state; const warn = [];
  const arr = (v, allowed, label) => { const a = Array.isArray(v) ? v.map(String) : []; const ok = a.filter((x) => allowed.includes(x)); if (ok.length < a.length) warn.push(`Ignored unknown ${label}: ${a.filter((x) => !allowed.includes(x)).join(", ")}`); return ok; };
  f.categories = arr(raw.categories, categoryList().map((c) => c.id), "category");
  f.lpIds = arr(raw.lpIds, s.lps.map((l) => l.id), "LP");
  f.lpTypes = arr(raw.lpTypes, Object.keys(LP_TYPES), "LP type");
  f.vehicles = arr(raw.vehicles, s.config?.vehicles || [], "vehicle");
  f.mfnStatus = arr(raw.mfnStatus, ["electable", "excluded", "unclear"], "MFN status");
  f.grantBasis = arr(raw.grantBasis, C.GRANT_BASES.map((x) => x[0]), "grant basis");
  f.obligation = arr(raw.obligation, ["yes", "no", "unclear"], "obligation value");
  const n = (v) => (v === null || v === undefined || v === "" || isNaN(Number(v)) ? null : Number(v));
  f.feeBelow = n(raw.feeBelow); f.feeAbove = n(raw.feeAbove);
  f.hasExpiry = typeof raw.hasExpiry === "boolean" ? raw.hasExpiry : null; f.inBundle = typeof raw.inBundle === "boolean" ? raw.inBundle : null;
  f.text = typeof raw.text === "string" ? raw.text.slice(0, 80) : "";
  return { f, warn };
}
function keywordCrossCheck(f, keywords, results, s) {
  const words = [...new Set(keywords.map((k) => String(k).trim().toLowerCase()).filter((k) => k.length > 1))];
  if (!words.length) return { words, hits: [] };
  const res = new Set(results.flatMap((t) => (t.paragraphs || []).map((p) => t.letterId + "#" + p)));
  const hits = [];
  for (const l of s.letters) {
    if (f.lpIds?.length && !f.lpIds.includes(l.lpId)) continue;
    const cov = C.coverage(l, s.terms);
    (l.paragraphs || []).forEach((p, i) => {
      const n = i + 1; const low = p.toLowerCase();
      const found = words.filter((w) => new RegExp("(^|[^a-z0-9])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(s|es)?([^a-z0-9]|$)", "i").test(low));
      if (!found.length || res.has(l.id + "#" + n)) return;
      const row = cov.rows[i];
      let why;
      if (row.state === "term") why = "Filed as: " + row.termIds.map((id) => { const t = s.terms.find((x) => x.id === id); return t ? `${catName(t.category)} (${t.status})` : id; }).join(", ");
      else if (row.state === "none") why = "Marked \"no obligation\" by a reviewer";
      else why = "Not linked to any term";
      if (l.status !== "approved") why += " · letter not yet approved";
      hits.push({ letter: l, n, text: p, found, why });
    });
  }
  return { words, hits };
}

function SearchView() {
  const s = useStore();
  const [q, setQ] = useState("");
  const [f, setF] = useState(emptyFilter());
  const [ai, setAi] = useState(null);
  const [open, setOpen] = useState(false);
  const results = useMemo(() => applyFilter(f, s), [f, s.terms, s.lps, s.bundles]);
  const kw = useMemo(() => {
    const catKw = (f.categories?.length ? f.categories : []).flatMap((id) => categoryList().find((c) => c.id === id)?.keywords || []);
    const words = [...(ai?.keywords || []), ...catKw, ...(f.text ? [f.text] : [])];
    return keywordCrossCheck(f, words, results, s);
  }, [f, ai, results, s.letters, s.terms]);
  const hl = useMemo(() => [...(f.text ? [f.text] : [])], [f.text]);
  /* Approved terms whose paragraphs the keyword cross-check found join the results, so a term filed under an
     unexpected category still answers the question. Hits on drafts and unlinked paragraphs stay in the cross-check. */
  const added = useMemo(() => {
    const ids = new Set(results.map((t) => t.id)); const out = [];
    for (const h of kw.hits) {
      if (h.letter.status !== "approved") continue;
      for (const t of s.terms) {
        if (t.letterId !== h.letter.id || t.status !== "approved" || ids.has(t.id) || !(t.paragraphs || []).includes(h.n)) continue;
        ids.add(t.id); out.push({ t, h });
      }
    }
    return out;
  }, [kw, results, s.terms]);
  const addedParas = new Set(added.map((x) => x.h.letter.id + "#" + x.h.n));
  const restHits = kw.hits.filter((h) => !addedParas.has(h.letter.id + "#" + h.n));

  async function ask(question) {
    const text = (question ?? q).trim(); if (!text) return;
    setQ(text);
    if (!RT.sample) { setF({ ...emptyFilter(), text: text.split(/\s+/).slice(0, 3).join(" ") }); setAi({ status: "off" }); setOpen(true); return; }
    setAi({ status: "run", question: text });
    const cats = categoryList().map((c) => `${c.id} = ${c.name}`).join("; ");
    const prompt = `Turn a question about a private infrastructure fund's side letters into a database filter. The filter runs over every recorded term, so the answer will be complete for whatever the filter selects. Prefer a broader filter: returning extra terms is better than missing one.

Category ids: ${cats}
LPs (id = name, type, commitment): ${s.lps.map((l) => `${l.id} = ${l.name}, ${l.type}, ${C.usd(l.commitmentUsd)}`).join("; ")}
LP types: ${Object.keys(LP_TYPES).join(", ")}
Vehicles: ${(s.config?.vehicles || []).join("; ")}
Term fields: mfnStatus (electable|excluded|unclear), grantBasis (list of size|closing|lp_status|anchor: why the term was granted; lp_status = it exists because of the LP's legal status), obligation (yes|no|unclear: an ongoing duty for the fund to deliver something or give notice), feeRatePct (the LP's management fee rate in percent where a term sets it; standard is ${s.config?.fund?.standardFeePct ?? 1.5}), expiry, bundle membership.

Question: ${text}

Reply with only JSON:
{"explanation":"one sentence saying what the filter selects","filter":{"categories":[],"lpIds":[],"lpTypes":[],"vehicles":[],"mfnStatus":[],"grantBasis":[],"obligation":[],"feeBelow":null,"feeAbove":null,"hasExpiry":null,"inBundle":null,"text":""},"keywords":["5 to 12 words or short phrases to scan the full text of every letter for, as a cross-check"]}
An empty list means any value. feeBelow and feeAbove are strict percentages.
Questions about reports, reporting, statements, notices, information or data the fund must deliver, or deadlines: set obligation to ["yes"] and leave categories empty unless the question names another subject (such as fees). Reports are often filed under ESG, Other or Fees rather than Reporting, so never filter them by category alone. Use "text" only when no structured field fits, with one short word or phrase.`;
    try {

    <div class="filterbar">

        ${ai?.status === "done" && ai.explanation ? html`<p class="muted small">${ai.explanation} <span class="mono">(${ai.modelApplied || "unconfirmed model"}${ai.modelApplied !== ai.model ? `, pinned ${ai.model}` : ""}, ${C.PROMPT_VERSIONS.search})</span></p>` : null}
        ${ai?.warn?.length ? html`<p class="note warn">${ai.warn.join(". ")}</p>` : null}

      </div>

    ${open ? html`<div class="filters card">

      <${Field} label="LP" wide><${Toggles} values=${f.lpIds} options=${s.lps.map((l) => [l.id, l.name])} onChange=${upd("lpIds")} /><//>
      <${Field} label="LP type" wide><${Toggles} values=${f.lpTypes} options=${Object.entries(LP_TYPES)} onChange=${upd("lpTypes")} /><//>
      <${Field} label="Vehicle" wide><${Toggles} values=${f.vehicles} options=${(s.config?.vehicles || []).map((v) => [v, v])} onChange=${upd("vehicles")} /><//>
      <${Field} label="MFN status"><${Toggles} values=${f.mfnStatus} options=${[["electable", "Electable"], ["excluded", "Excluded"], ["unclear", "Unclear"]]} onChange=${upd("mfnStatus")} /><//>

      <${Field} label="Fee rate below (%)"><input id="fee-below" type="number" step="0.01" value=${f.feeBelow ?? ""} onInput=${(e) => upd("feeBelow")(e.target.value === "" ? null : Number(e.target.value))} /><//>
      <${Field} label="Fee rate above (%)"><input id="fee-above" type="number" step="0.01" value=${f.feeAbove ?? ""} onInput=${(e) => upd("feeAbove")(e.target.value === "" ? null : Number(e.target.value))} /><//>

      <${Field} label="Bundle"><${Seg} value=${f.inBundle} options=${[[null, "Any"], [true, "In a bundle"], [false, "Not bundled"]]} onChange=${upd("inBundle")} /><//>

    ] : html`<${Empty} title="No terms match this filter">Loosen the filter, or check the keyword cross-check below.<//>`}</div>

    <section class="crosscheck card">
      <h3>Keyword cross-check</h3>
      <p class="muted small">Scans the full text of every side letter for the words below, including letters still in review, and lists any paragraph that is not already in the results. These are the places a term may have been filed under the wrong category or missed.</p>
      ${kw.words.length ? html`<div class="fchips">${kw.words.map((w) => html`<span class="fchip mono">${w}</span>`)}</div>` : html`<p class="muted small">No keywords yet: ask a question or pick a category.</p>`}
      ${kw.words.length ? (restHits.length ? html`<p><${Pill} kind="warn">${restHits.length} possible missed ${restHits.length === 1 ? "term" : "terms"}<//></p>
        <ul class="hits">${restHits.map((h) => html`<li>
          <div class="hit-h"><a href=${"#letter-" + h.letter.id}>${lpName(h.letter.lpId)} · ¶ ${h.n}</a> <span class="muted small">${h.why}</span></div>
          <p class="hit-t"><${Highlight} text=${h.text} words=${h.found} /></p></li>`)}</ul>`
        : html`<p><${Pill} kind="ok">Every paragraph containing these words is in the results<//></p>`) : null}
    </section>
  </section>`;
}

/* ---------------- Letters ---------------- */
function letterCounts(l, s) {
  const terms = s.terms.filter((t) => t.letterId === l.id && C.isLive(t));
  const flags = terms.filter((t) => t.status === "draft").reduce((a, t) => a + C.termFlags(t, l).length, 0) + (l.status === "needs_review" ? C.letterFlags(l, s.terms).length : 0);
  return { terms: terms.length, approved: terms.filter((t) => t.status === "approved").length, flags };
}
function LettersView() {
  const s = useStore();
  const rows = [...s.letters].sort((a, b) => (a.signedDate < b.signedDate ? 1 : -1));
  return html`<section class="view">
    <div class="view-h"><h1>Side letters</h1><button class="btn primary" onClick=${() => go("#add")} disabled=${s.readOnly}>Add a side letter</button></div>
    <div class="tablewrap"><table class="tbl">
      <thead><tr><th>LP</th><th>Signed</th><th>Vehicle</th><th>Source</th><th>Terms</th><th>Status</th><th>Flags</th></tr></thead>
      <tbody>${rows.map((l) => { const c = letterCounts(l, s); return html`<tr key=${l.id} class="rowlink" onClick=${() => go("#letter-" + l.id)}>
        <td><a href=${"#letter-" + l.id}>${lpName(l.lpId)}</a><div class="muted small">${l.title}</div></td>
        <td class="num">${fmtDate(l.signedDate)}</td><td>${l.vehicle}</td><td>${{ sample: "Sample text", docx: "Word", pdf: "PDF", paste: "Pasted text", manual: "Entered by hand" }[l.source] || l.source}</td>
        <td class="num">${c.approved}/${c.terms}</td><td><${StatusPill} status=${l.status} /></td>
        <td>${c.flags ? html`<${Pill} kind="warn">${c.flags}<//>` : html`<span class="muted">—</span>`}</td></tr>`; })}</tbody>
    </table></div>
    ${(() => { const arch = s.all.letters.filter((l) => !s.letters.some((x) => x.id === l.id)); return arch.length ? html`<details class="card"><summary>${arch.length} archived side ${arch.length === 1 ? "letter" : "letters"}</summary>
      <ul class="small">${arch.map((l) => html`<li key=${l.id}><a href=${"#letter-" + l.id}>${lpName(l.lpId)}</a> · ${l.title} · ${l.archived ? `archived ${fmtTime(l.archived.at)}` : "its LP is archived"}${l.archived ? html` <${RestoreButton} col="letters" rec=${l} label=${lpName(l.lpId) + "'s letter"} />` : null}</li>`)}</ul></details>` : null; })()}
  </section>`;
}

function IntegrityBox({ letter }) {
  const s = useStore();
  const o = s.originals.find((x) => x.id === letter.originalId);
  const res = o ? s.integrity[o.id] : null;
  const auditReady = !!s.ready.audit && !!s.chain;
  useEffect(() => { if (o && auditReady && !res) verifyOriginal(o); }, [o?.id, o?.sha256, auditReady]);
  if (letter.source === "manual") return html`<div class="card integrity"><h3>Original document</h3><p class="muted">Terms were entered by hand; there is no source document stored.</p></div>`;
  if (!o) return html`<div class="card integrity bad"><h3>Original document</h3><p>No original is stored for this letter.</p></div>`;
  async function download() {
    if (!RT.downloads) return;
    try { const r = await verifyOriginal(o); if (r.status !== "ok") { toast("bad", "Download stopped: the file failed its integrity check."); return; }
      const bytes = await originalBytes(o); await RT.downloads.save({ filename: o.filename, data: bytes }); } catch (e) { if (e?.code !== "cancelled") toast("bad", errText(e)); }
  }
  const st = res?.status || "checking";
  return html`<div class=${"card integrity " + (st === "ok" ? "ok" : st === "checking" ? "" : "bad")}>
    <div class="integ-h"><h3>Original document</h3>
      ${st === "ok" ? html`<${Pill} kind="ok">Integrity verified<//>` : st === "checking" ? html`<${Pill} kind="info">Checking…<//>` : html`<${Pill} kind="bad">${st === "error" ? "Could not check" : "Integrity check failed"}<//>`}</div>
    <dl class="facts">
      <div><dt>File</dt><dd>${o.filename}</dd></div>
      <div><dt>Size</dt><dd class="num">${o.sizeBytes?.toLocaleString()} bytes</dd></div>
      <div><dt>Stored as</dt><dd>${{ asset: "Read-only file (asset store)", "asset-b64": "Read-only file (asset store, encoded)", "inline-text": "Text in the database", "inline-b64": "Encoded file in the database" }[o.storage]}</dd></div>
      <div><dt>Stored</dt><dd>${fmtTime(o.createdAt)} by ${nameOf(o.createdBy)}</dd></div>
    </dl>
    <div class="hashes">
      <div><span class="flabel">SHA-256 saved with the file</span><code class="hash">${o.sha256}</code></div>
      <div><span class="flabel">SHA-256 in the audit log</span><code class="hash">${res?.logged || "—"}</code></div>
      <div><span class="flabel">SHA-256 computed just now</span><code class="hash">${res?.computed || "—"}</code></div>
    </div>
    <p class="small">${res?.message || "Computing the file's hash…"} ${res?.at ? html`<span class="muted">Checked ${fmtTime(res.at)}.</span>` : null}</p>
    <div class="row">
      <button class="btn" onClick=${() => verifyOriginal(o)}>Verify again</button>
      ${o.storage === "asset" ? html`<a class="btn" href=${"/_blob/" + o.assetId} target="_blank" rel="noopener">Open PDF</a>` : null}
      ${s.caps.downloads === "on" ? html`<button class="btn" onClick=${download}>Download original</button>` : null}
    </div>
  </div>`;
}

function LetterDetail({ id }) {
  const s = useStore();
  const l = s.all.letters.find((x) => x.id === id);
  const [supersede, setSupersede] = useState(null);
  if (!l) return html`<section class="view"><${Empty} title="Side letter not found">It may still be loading. <a href="#letters">Back to side letters</a><//></section>`;
  const lp = s.all.lps.find((x) => x.id === l.lpId);
  const terms = s.all.terms.filter((t) => t.letterId === l.id);
  const cov = C.coverage(l, s.all.terms);
  const archivedNote = l.archived ? `This side letter was archived ${fmtTime(l.archived.at)} by ${nameOf(l.archived.by)}${l.archived.reason ? ": " + l.archived.reason : ""}. Its terms are out of search, alerts and worksheets.` : lp?.archived ? `${lp.name} is archived, so this letter and its terms are out of search, alerts and worksheets.` : null;
  async function doSupersede(t, reason) {
    await act("Marking superseded", async () => {
      await patch("terms/" + t.id, { status: "superseded", supersededReason: reason, supersededAt: new Date().toISOString(), supersededBy: RT.meId });
      await appendAudit("term.superseded", "term", t.id, `Marked superseded: ${t.summary}`, { reason, before: { status: t.status } });
      toast("ok", "Term marked superseded."); setSupersede(null);
    });
  }
  return html`<section class="view">
    <a class="back" href="#letters">← Side letters</a>
    <div class="view-h"><div><h1>${lp?.name || "Unknown LP"}</h1><p class="muted">${l.title} · signed ${fmtDate(l.signedDate)} · ${l.vehicle} · ${LP_TYPES[lp?.type] || ""} · ${C.usd(lp?.commitmentUsd)}</p></div>
      <div class="row">${l.archived ? html`<${RestoreButton} col="letters" rec=${l} label=${(lp?.name || "this LP") + "'s letter"} />` : !lp?.archived ? html`<${ArchiveButton} col="letters" rec=${l} label=${(lp?.name || "this LP") + "'s letter"} />` : null}<${StatusPill} status=${l.status} />${!archivedNote && (l.status === "needs_review" || l.status === "failed") ? html`<button class="btn primary" onClick=${() => go("#review-" + l.id)}>Open review</button>` : null}</div></div>
    ${archivedNote ? html`<div class="note warn">${archivedNote}</div>` : null}
    ${l.status === "failed" ? html`<div class="note bad">Extraction failed: ${l.extraction?.error || "unknown error"}. Open the review to retry or enter the terms by hand.</div>` : null}
    <${IntegrityBox} letter=${l} />
    <div class="two">
      <div class="card"><h3>Letter text</h3>
        <ol class="paras">${(l.paragraphs || []).map((p, i) => { const row = cov.rows[i]; return html`<li class=${"para p-" + row.state}>
          <span class="pn">¶ ${i + 1}</span><div><p>${p}</p><div class="small muted">${row.state === "term" ? row.termIds.map((tid) => catName(s.all.terms.find((t) => t.id === tid)?.category)).join(", ") : row.state === "none" ? "No obligation" : html`<${Pill} kind="warn">Not linked to a term<//>`}</div></div></li>`; })}</ol>
        ${l.source === "manual" ? html`<p class="muted">No letter text: terms entered by hand.</p>` : null}
      </div>
      <div class="stack">
        <h3>${terms.length} terms</h3>
        ${terms.map((t) => html`<${TermCard} key=${t.id} t=${t} showLp=${false} extra=${html`<div>
          <${Provenance} t=${t} />
          ${t.status === "superseded" ? html`<p class="small muted">Superseded ${fmtTime(t.supersededAt)}: ${t.supersededReason}</p>` : null}
          ${t.status === "approved" && !s.readOnly ? (supersede?.id === t.id ? html`<form class="row" onSubmit=${(e) => { e.preventDefault(); if (supersede.reason.trim()) doSupersede(t, supersede.reason.trim()); }}>
              <input id=${"sup-" + t.id} type="text" placeholder="Reason, e.g. amended by letter of 3 Feb 2027" value=${supersede.reason} onInput=${(e) => setSupersede({ ...supersede, reason: e.target.value })} />
              <button class="btn" type="submit">Confirm</button><button class="btn ghost" type="button" onClick=${() => setSupersede(null)}>Cancel</button></form>`
            : html`<button class="btn ghost small" onClick=${() => setSupersede({ id: t.id, reason: "" })}>Mark superseded</button>`) : null}
        </div>`} />`)}
        ${l.extraction ? html`<p class="small muted">Extraction: ${l.extraction.modelApplied || l.extraction.model} · prompt ${l.extraction.promptVersion} · ${fmtTime(l.extraction.at)}</p>` : null}

    </div>
  </section>`;

/* ---------------- Intake ---------------- */
function IntakeView() {
  const s = useStore();
  const [lpId, setLpId] = useState("");
  const [newLp, setNewLp] = useState({ name: "", type: "public_pension", commitment: "", vehicle: "", close: "" });
  const [vehicle, setVehicle] = useState("");
  const [signed, setSigned] = useState(new Date().toISOString().slice(0, 10));
  const [title, setTitle] = useState("Side letter");
  const [mode, setMode] = useState("upload");
  const [file, setFile] = useState(null);
  const [text, setText] = useState("");
  const [steps, setSteps] = useState([]);
  const [running, setRunning] = useState(false);
  const [doneId, setDoneId] = useState(null);
  const ctl = useRef(null);
  const vehicles = s.config?.vehicles || [];
  const lp = s.lps.find((l) => l.id === lpId);
  useEffect(() => { if (lp && !vehicle) setVehicle(lp.vehicle); }, [lpId]);
  const setStep = (k, st, t) => setSteps((xs) => { const i = xs.findIndex((x) => x.k === k); const n = { k, st, t }; return i >= 0 ? xs.map((x, j) => (j === i ? n : x)) : [...xs, n]; });

  const ready = (lpId === "new" ? newLp.name.trim() && Number(newLp.commitment) > 0 : !!lpId) && vehicle && signed && (mode === "manual" || (mode === "upload" ? !!file : text.trim().length > 40));

  async function start() {
    setSteps([]); setRunning(true); setDoneId(null); ctl.current = new AbortController();
    const ok = await act("Adding side letter", async () => {
      let theLpId = lpId;
      if (lpId === "new") {
        theLpId = rid("lp");
        const doc = { name: newLp.name.trim(), type: newLp.type, commitmentUsd: Math.round(Number(newLp.commitment) * 1e6), vehicle: newLp.vehicle || vehicle, close: newLp.close || "", mfn: { hasMfn: true, basis: "size", thresholdUsd: null, excludedCategories: [], excludedTermIds: [], note: "" } };
        await put("lps/" + theLpId, doc);
        await appendAudit("lp.created", "lp", theLpId, `Added LP ${doc.name} (${C.usd(doc.commitmentUsd)})`, { after: doc });
        setStep("lp", "ok", `Added LP ${doc.name}`);
      }
      const letterId = rid("sl");
      let paragraphs = [], source = mode === "manual" ? "manual" : mode === "paste" ? "paste" : null, originalId = null;
      if (mode !== "manual") {
        let bytes = null, kind = "paste", raw = text;
        if (mode === "upload") {
          const name = file.name.toLowerCase();
          kind = name.endsWith(".pdf") ? "pdf" : name.endsWith(".docx") ? "docx" : null;
          if (!kind) throw new Error("Upload a .docx or .pdf file. Older .doc files must be saved as .docx first.");
          source = kind;
          bytes = new Uint8Array(await file.arrayBuffer());
          setStep("read", "ok", `Read ${file.name} (${bytes.length.toLocaleString()} bytes)`);
        }
        setStep("store", "run", "Storing the original and computing its SHA-256…");
        const st = await storeOriginal({ kind, file, bytes, text: raw, letterId });
        originalId = st.origId;
        setStep("store", "ok", `Original stored read-only · SHA-256 ${short(st.sha)}`);
        setStep("text", "run", "Extracting text…");
        if (kind === "docx") raw = await docxToText(bytes);
        if (kind === "pdf") raw = await pdfToText(bytes);
        paragraphs = C.splitParagraphs(raw);
        if (!paragraphs.length) throw new Error(kind === "pdf" ? "No text found in this PDF. It may be a scan; paste the text instead or enter terms by hand." : "No text found in this document.");
        setStep("text", "ok", `${paragraphs.length} paragraphs`);
      }
      const letter = { lpId: theLpId, vehicle, signedDate: signed, title: title.trim() || "Side letter", source, originalId, paragraphs, noObligation: [], status: mode === "manual" ? "needs_review" : "pending", extraction: null, secondPass: null, createdAt: new Date().toISOString(), createdBy: RT.meId };
      await put("letters/" + letterId, letter);
      await appendAudit("letter.created", "letter", letterId, `Added side letter for ${lpName(theLpId) === "Unknown LP" ? newLp.name : lpName(theLpId)} (${mode === "manual" ? "terms entered by hand" : paragraphs.length + " paragraphs"})`, { originalId, source, vehicle, signedDate: signed, paragraphs: paragraphs.length });
      setDoneId(letterId);
      if (mode !== "manual") {
        if (!RT.sample) { await patch("letters/" + letterId, { status: "failed", extraction: { error: "Claude is not available in this view", at: new Date().toISOString(), by: RT.meId } }); setStep("extract", "bad", "Claude is not available here. Open the review to enter the terms by hand."); return true; }
        // wait for the letter to arrive in the store
        for (let i = 0; i < 40 && !store.state.letters.find((x) => x.id === letterId); i++) await sleep(100);
        try { await runExtraction(letterId, { onStep: setStep, signal: ctl.current.signal }); } catch (e) { /* step shows the error; letter is marked failed */ }
      }
      return true;
    });
    setRunning(false);
  }

  return html`<section class="view narrow">
    <a class="back" href="#letters">← Side letters</a>
    <h1>Add a side letter</h1>
    <p class="muted">The original is stored read-only with its SHA-256 fingerprint. Claude (${s.config?.model?.pinned || "pinned model"}) drafts the terms; nothing becomes searchable until a person approves it.</p>
    <div class="card form">
      <h3>1. Which LP and vehicle</h3>
      <div class="grid2">
        <${Field} label="LP"><select id="in-lp" value=${lpId} onChange=${(e) => setLpId(e.target.value)}>
          <option value="">Choose an LP…</option>${[...s.lps].sort((a, b) => a.name.localeCompare(b.name)).map((l) => html`<option value=${l.id}>${l.name}</option>`)}<option value="new">+ New LP not listed</option></select><//>
        <${Field} label="Fund or vehicle"><select id="in-veh" value=${vehicle} onChange=${(e) => setVehicle(e.target.value)}><option value="">Choose…</option>${vehicles.map((v) => html`<option value=${v}>${v}</option>`)}</select><//>
        <${Field} label="Date signed"><input id="in-date" type="date" value=${signed} onInput=${(e) => setSigned(e.target.value)} /><//>
        <${Field} label="Title"><input id="in-title" type="text" value=${title} onInput=${(e) => setTitle(e.target.value)} /><//>
      </div>
      ${lpId === "new" ? html`<div class="grid2 sub">
        <${Field} label="LP name"><input id="nl-name" type="text" value=${newLp.name} onInput=${(e) => setNewLp({ ...newLp, name: e.target.value })} /><//>
        <${Field} label="LP type"><select id="nl-type" value=${newLp.type} onChange=${(e) => setNewLp({ ...newLp, type: e.target.value })}>${Object.entries(LP_TYPES).map(([k, v]) => html`<option value=${k}>${v}</option>`)}</select><//>
        <${Field} label="Commitment ($M)"><input id="nl-commit" type="number" min="0" step="0.5" value=${newLp.commitment} onInput=${(e) => setNewLp({ ...newLp, commitment: e.target.value })} /><//>
        <${Field} label="Closing"><input id="nl-close" type="text" placeholder="e.g. Second closing" value=${newLp.close} onInput=${(e) => setNewLp({ ...newLp, close: e.target.value })} /><//>
        <p class="small muted wide">Set this LP's MFN rules on the LPs page after adding.</p>
      </div>` : null}
      <h3>2. The letter</h3>
      <${Seg} value=${mode} onChange=${setMode} options=${[["upload", "Upload Word or PDF"], ["paste", "Paste text"], ["manual", "Enter terms by hand"]]} />
      ${mode === "upload" ? html`<label class="drop"><input id="in-file" type="file" accept=".docx,.pdf,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" onChange=${(e) => setFile(e.target.files[0] || null)} />
        <span>${file ? html`<strong>${file.name}</strong> · ${file.size.toLocaleString()} bytes` : "Choose a .docx or .pdf file"}</span></label>
        <p class="small muted">${s.caps.assets === "on" ? "Originals go to the artifact's file store, where a stored file can't be edited in place." : "File storage needs Editor access here; small files are kept in the database instead."} Scanned PDFs without a text layer can't be read.</p>` : null}
      ${mode === "paste" ? html`<textarea id="in-text" rows="12" placeholder="Paste the full side letter. Leave a blank line between paragraphs." value=${text} onInput=${(e) => setText(e.target.value)}></textarea>` : null}
      ${mode === "manual" ? html`<p class="note">You'll add each term on the review screen. Without a stored letter, the exact-quote and coverage checks can't run, so each term is flagged "entered by hand" until someone checks it against the signed copy.</p>` : null}
      <div class="row end"><button class="btn primary" disabled=${!ready || running || s.readOnly} onClick=${start}>${running ? "Working…" : mode === "manual" ? "Create and start entering terms" : "Store and extract terms"}</button>
        ${running ? html`<button class="btn ghost" onClick=${() => ctl.current?.abort()}>Stop</button>` : null}</div>
    </div>
    ${steps.length ? html`<div class="card"><h3>Progress</h3><ol class="steps">${steps.map((x) => html`<li class=${"step " + x.st}><span class="dot"></span>${x.t}</li>`)}</ol>
      ${doneId && !running ? html`<div class="row"><button class="btn primary" onClick=${() => go("#review-" + doneId)}>Open review</button><button class="btn" onClick=${() => go("#letter-" + doneId)}>View letter</button></div>` : null}</div>` : null}
  </section>`;
}

/* ===== UI part 2: review and approval, MFN, LPs ===== */

const TERM_FIELDS = ["category", "summary", "quote", "paragraphs", "vehicle", "conditions", "expiry", "grantBasis", "mfnStatus", "mfnReason", "obligation", "feeRatePct", "carryPct", "bundleId"];
function diffTerm(a, b) {
  const ch = {};
  for (const k of TERM_FIELDS) if (C.canon(a[k] ?? null) !== C.canon(b[k] ?? null)) ch[k] = { before: a[k] ?? null, after: b[k] ?? null };
  return ch;
}
function approvalBlockers(t, letter) {
  const out = [];
  if (letter && letter.source !== "manual" && C.quoteCheck(t.quote, letter.paragraphs).status === "fail") out.push("The quote must appear word-for-word in the letter");
  if (t.mfnStatus !== "electable" && t.mfnStatus !== "excluded") out.push("Set MFN status to electable or excluded");
  else if (!String(t.mfnReason || "").trim()) out.push("Give a reason for the MFN status");
  if (t.category === C.UNCLEAR) out.push("Choose a category");
  if (!Array.isArray(t.grantBasis)) out.push('Set the grant basis (or "None of these")');
  if (!String(t.summary || "").trim() || t.summary === C.UNCLEAR) out.push("Write a summary");
  const open = (letter?.secondPass?.issues || []).filter((i) => !i.resolved && i.termId === t.id);
  if (open.length) out.push("Resolve the second-pass issue on this term");
  return out;
}

/* Saves a term (new or existing), keeps bundle membership in sync, writes one audit entry. */
async function saveTerm({ original, draft, letter, newBundle, approve, auditAction }) {
  const isNew = !original;
  const id = original?.id || rid("t");
  let bundleId = draft.bundleId || null;
  if (bundleId === "__new") {
    bundleId = rid("bnd");
    await put("bundles/" + bundleId, { name: newBundle.name.trim() || "Bundle", lpId: letter.lpId, termIds: [], allOrNothing: !!newBundle.allOrNothing, note: newBundle.note || "", createdBy: RT.meId, createdAt: new Date().toISOString() });
    await appendAudit("bundle.created", "bundle", bundleId, `Created bundle "${newBundle.name.trim() || "Bundle"}" for ${lpName(letter.lpId)}`, { allOrNothing: !!newBundle.allOrNothing });
  }
  const body = {}; for (const k of TERM_FIELDS) body[k] = draft[k] ?? null;
  body.bundleId = bundleId;
  const oldBundle = original?.bundleId || null;
  const changes = diffTerm(original || {}, body);
  const now = new Date().toISOString();
  if (isNew) {
    await put("terms/" + id, { ...body, letterId: letter.id, lpId: letter.lpId, status: approve ? "approved" : "draft", origin: "manual",
      provenance: { model: null, modelApplied: undefined, promptVersion: "manual entry", extractedAt: now, extractedBy: RT.meId, approvedBy: approve ? RT.meId : null, approvedAt: approve ? now : null } });
  } else {
    const upd = { ...body };
    if (approve) { upd.status = "approved"; upd.provenance = { ...(original.provenance || {}), approvedBy: RT.meId, approvedAt: now }; }
    await patch("terms/" + id, upd);
  }
  if (oldBundle !== bundleId) {
    const s = store.state;
    if (oldBundle) { const b = s.bundles.find((x) => x.id === oldBundle); if (b) await patch("bundles/" + oldBundle, { termIds: b.termIds.filter((x) => x !== id) }); }
    if (bundleId) { const b = s.bundles.find((x) => x.id === bundleId); const ids = b ? b.termIds : []; await patch("bundles/" + bundleId, { termIds: [...new Set([...ids, id])] }); }
  }
  const verb = isNew ? (approve ? "Added and approved" : "Added") : approve ? (Object.keys(changes).length ? "Edited and approved" : "Approved") : "Edited";
  await appendAudit(auditAction || (isNew ? "term.created" : approve ? "term.approved" : "term.edited"), "term", id, `${verb} ${catName(body.category)} term for ${lpName(letter.lpId)}: ${body.summary}`,
    { letterId: letter.id, changes, quoteCheck: C.quoteCheck(body.quote, letter.paragraphs).status, unclear: C.unclearFields(body).map((u) => u.field) });
  return id;
}

function TermEditor({ t, letter, onDone, isNew, seed }) {
  const s = useStore();
  const base = t || { category: C.UNCLEAR, summary: "", quote: "", paragraphs: [], vehicle: letter.vehicle, conditions: "None", expiry: "None", grantBasis: C.UNCLEAR, mfnStatus: C.UNCLEAR, mfnReason: "", obligation: { is: "no", deadline: "" }, feeRatePct: null, carryPct: null, bundleId: null, ...(seed || {}) };
  const [d, setD] = useState({ ...base, obligation: { ...(base.obligation || {}) } });
  const [paraText, setParaText] = useState((base.paragraphs || []).join(", "));
  const [nb, setNb] = useState({ name: "", allOrNothing: true, note: "" });
  const [rejecting, setRejecting] = useState(null);
  useEffect(() => { if (t && !isNew) { setD({ ...t, obligation: { ...(t.obligation || {}) } }); setParaText((t.paragraphs || []).join(", ")); } }, [t && C.canon(t)]);
  const up = (k, v) => setD((x) => ({ ...x, [k]: v }));
  const qc = C.quoteCheck(d.quote, letter.source === "manual" ? [] : letter.paragraphs);
  const draftForCheck = { ...d, id: t?.id };
  const blockers = approvalBlockers(draftForCheck, letter);
  const unclear = C.unclearFields(d);
  const dirty = isNew || Object.keys(diffTerm(t || {}, { ...d, bundleId: d.bundleId || null })).length > 0;
  const lpBundles = s.bundles.filter((b) => b.lpId === letter.lpId);
  const openIssues = (letter.secondPass?.issues || []).filter((i) => !i.resolved && t && i.termId === t.id);
  const ro = s.readOnly || (t && t.status !== "draft" && !isNew);
  const vehicles = s.config?.vehicles || [];
  function setParas(v) { setParaText(v); up("paragraphs", [...new Set(v.split(/[^0-9]+/).map(Number).filter((n) => n >= 1 && n <= (letter.paragraphs || []).length))].sort((a, b) => a - b)); }

  async function save(approve) {
    const r = await act(approve ? "Approving" : "Saving", async () => {
      await saveTerm({ original: isNew ? null : t, draft: d, letter, newBundle: nb, approve });
      toast("ok", approve ? "Term approved. It is now searchable." : "Saved."); return true;
    });
    if (r && onDone) onDone();
  }
  async function reject() {
    await act("Rejecting", async () => {
      await patch("terms/" + t.id, { status: "rejected", rejectedReason: rejecting, rejectedBy: RT.meId, rejectedAt: new Date().toISOString() });
      await appendAudit("term.rejected", "term", t.id, `Rejected draft term for ${lpName(letter.lpId)}: ${t.summary}`, { reason: rejecting });
      toast("ok", "Term rejected."); setRejecting(null);
    });
  }
  async function resolveIssue(iss, note) {
    await act("Resolving", async () => {
      const issues = (letter.secondPass.issues || []).map((i) => (i.id === iss.id ? { ...i, resolved: true, resolution: note, resolvedBy: RT.meId, resolvedAt: new Date().toISOString() } : i));
      await patch("letters/" + letter.id, { secondPass: { ...letter.secondPass, issues } });
      await appendAudit("secondpass.resolved", "letter", letter.id, `Resolved second-pass issue: ${iss.problem}`, { issueId: iss.id, termId: iss.termId, resolution: note });
    });
  }
  const flags = t ? C.termFlags(t, letter) : [];
  return html`<article class=${"term editor " + (t?.status || "draft")}>
    <header class="term-h">
      ${t ? html`<${StatusPill} status=${t.status} />` : html`<${Pill} kind="info">New term<//>`}
      <${Pill} kind="cat">${catName(d.category)}<//>
      ${qc.status === "pass" ? html`<${Pill} kind="ok">Quote found ✓<//>` : qc.status === "fail" ? html`<${Pill} kind="bad">Quote not found<//>` : html`<${Pill} kind="neutral">No source to check<//>`}
      ${unclear.length ? html`<${Pill} kind="warn">${unclear.length} unclear<//>` : null}
    </header>
    ${flags.length && t?.status === "draft" ? html`<ul class="flags">${flags.map((f) => html`<li class=${"flag " + f.type}>${f.message}</li>`)}</ul>` : null}
    ${openIssues.map((iss) => html`<${IssueResolver} key=${iss.id} iss=${iss} onResolve=${resolveIssue} disabled=${s.readOnly} />`)}
    <fieldset disabled=${ro}>
    <div class="egrid">
      <${Field} label="Category"><select id=${"cat-" + (t?.id || "new")} value=${d.category} onChange=${(e) => up("category", e.target.value)}><option value="unclear">Unclear</option>${categoryList().map((c) => html`<option value=${c.id}>${c.name}</option>`)}</select><//>
      <${Field} label="Paragraphs" hint="e.g. 2, 5"><input id=${"par-" + (t?.id || "new")} type="text" value=${paraText} onInput=${(e) => setParas(e.target.value)} /><//>
      <${Field} label="Summary" wide><textarea id=${"sum-" + (t?.id || "new")} rows="2" value=${d.summary} onInput=${(e) => up("summary", e.target.value)}></textarea><//>
      <${Field} label="Exact quote from the letter" wide hint=${qc.status === "pass" ? "Found word-for-word in ¶ " + (qc.paragraphs || []).join(", ") : qc.message}><textarea class=${"quote-in " + qc.status} id=${"quo-" + (t?.id || "new")} rows="3" value=${d.quote} onInput=${(e) => up("quote", e.target.value)}></textarea><//>
      <${Field} label="Fund or vehicle"><select id=${"veh-" + (t?.id || "new")} value=${d.vehicle} onChange=${(e) => up("vehicle", e.target.value)}><option value="unclear">Unclear</option>${vehicles.map((v) => html`<option value=${v}>${v}</option>`)}</select><//>
      <${Field} label="Conditions attached" hint='"None" if none'><input id=${"con-" + (t?.id || "new")} type="text" value=${d.conditions} onInput=${(e) => up("conditions", e.target.value)} /><//>
      <${Field} label="Expiry date or trigger" hint='"None" if none'><input id=${"exp-" + (t?.id || "new")} type="text" value=${d.expiry} onInput=${(e) => up("expiry", e.target.value)} /><//>
      <${Field} label="Granted for" hint="Why the fund gave it; MFN carve-outs use this"><${GrantBasisField} id=${"gb-" + (t?.id || "new")} value=${d.grantBasis} onChange=${(v) => up("grantBasis", v)} /><//>
      <${Field} label="MFN status"><${Seg} value=${d.mfnStatus} onChange=${(v) => up("mfnStatus", v)} options=${[["electable", "Electable"], ["excluded", "Excluded"], ["unclear", "Unclear"]]} /><//>
      <${Field} label="MFN reason"><input id=${"mfr-" + (t?.id || "new")} type="text" value=${d.mfnReason} onInput=${(e) => up("mfnReason", e.target.value)} /><//>
      <${Field} label="Ongoing obligation for the fund"><${Seg} value=${d.obligation?.is} onChange=${(v) => up("obligation", { ...d.obligation, is: v })} options=${[["yes", "Yes"], ["no", "No"], ["unclear", "Unclear"]]} /><//>
      ${d.obligation?.is === "yes" ? html`<${Field} label="Deadline or frequency"><input id=${"dl-" + (t?.id || "new")} type="text" value=${d.obligation.deadline} onInput=${(e) => up("obligation", { ...d.obligation, deadline: e.target.value })} /><//>` : null}
      <${Field} label="Management fee rate (%)" hint="Resulting rate, if this term sets one"><input id=${"fee-" + (t?.id || "new")} type="number" step="0.01" value=${d.feeRatePct ?? ""} onInput=${(e) => up("feeRatePct", e.target.value === "" ? null : Number(e.target.value))} /><//>
      <${Field} label="Carried interest (%)"><input id=${"car-" + (t?.id || "new")} type="number" step="0.5" value=${d.carryPct ?? ""} onInput=${(e) => up("carryPct", e.target.value === "" ? null : Number(e.target.value))} /><//>
      <${Field} label="Bundle" hint="Terms granted together or tied to a condition"><select id=${"bnd-" + (t?.id || "new")} value=${d.bundleId || ""} onChange=${(e) => up("bundleId", e.target.value || null)}>
        <option value="">Not bundled</option>${lpBundles.map((b) => html`<option value=${b.id}>${b.name}${b.allOrNothing ? " (all-or-nothing)" : ""}</option>`)}<option value="__new">+ New bundle…</option></select><//>
      ${d.bundleId === "__new" ? html`<div class="wide newbundle">
        <${Field} label="Bundle name"><input id=${"nbn-" + (t?.id || "new")} type="text" value=${nb.name} onInput=${(e) => setNb({ ...nb, name: e.target.value })} /><//>
        <label class="check"><input id=${"nba-" + (t?.id || "new")} type="checkbox" checked=${nb.allOrNothing} onChange=${(e) => setNb({ ...nb, allOrNothing: e.target.checked })} /> All-or-nothing: an electing LP must take every term in the bundle</label>
        <${Field} label="Why these go together"><input id=${"nbt-" + (t?.id || "new")} type="text" value=${nb.note} onInput=${(e) => setNb({ ...nb, note: e.target.value })} /><//>
      </div>` : null}
    </div>
    </fieldset>
    ${t ? html`<${Provenance} t=${t} />` : null}
    ${!ro ? html`<div class="row end">
      ${blockers.length ? html`<span class="small bad-text">Before approving: ${blockers.join("; ")}.</span>` : unclear.length ? html`<span class="small muted">Approving keeps ${unclear.map((u) => u.label.toLowerCase()).join(", ")} as unclear.</span>` : null}
      ${t && !isNew ? (rejecting !== null ? html`<input id=${"rej-" + t.id} type="text" placeholder="Why reject?" value=${rejecting} onInput=${(e) => setRejecting(e.target.value)} /><button class="btn" disabled=${!rejecting.trim()} onClick=${reject}>Confirm reject</button><button class="btn ghost" onClick=${() => setRejecting(null)}>Cancel</button>`
        : html`<button class="btn ghost" onClick=${() => setRejecting("")}>Reject</button>`) : null}
      ${isNew && onDone ? html`<button class="btn ghost" onClick=${onDone}>Cancel</button>` : null}
      <button class="btn" disabled=${!dirty} onClick=${() => save(false)}>${isNew ? "Save as draft" : "Save changes"}</button>
      <button class="btn primary" disabled=${blockers.length > 0} onClick=${() => save(true)}>${dirty && !isNew ? "Save and approve" : "Approve"}</button>
    </div>` : null}
  </article>`;
}

function IssueResolver({ iss, onResolve, disabled }) {
  const [note, setNote] = useState("");
  return html`<div class="issue"><div><${Pill} kind=${iss.severity === "high" ? "bad" : "warn"}>Second pass · ${iss.severity}<//> ${iss.paragraph ? html`<span class="muted small">¶ ${iss.paragraph}</span>` : null}</div>
    <p>${iss.problem}</p>
    <form class="row" onSubmit=${(e) => { e.preventDefault(); if (note.trim()) onResolve(iss, note.trim()); }}>
      <input id=${"iss-" + iss.id} type="text" placeholder="What you checked or changed" value=${note} onInput=${(e) => setNote(e.target.value)} disabled=${disabled} />
      <button class="btn" type="submit" disabled=${disabled || !note.trim()}>Mark resolved</button></form></div>`;
}

/* ---- Letter vs LP record (B3) ---- */
const normName = (x) => String(x || "").toLowerCase().replace(/[‘’']/g, "'").replace(/\bthe\b/g, "").replace(/[^a-z0-9']+/g, " ").trim();
function factMismatches(l, lp) {
  const f = l.facts; if (!f || !lp) return [];
  const out = [];
  if (f.commitmentUsd != null && f.commitmentUsd !== lp.commitmentUsd) out.push({ key: "commitment", label: "Commitment", letter: C.usd(f.commitmentUsd), record: C.usd(lp.commitmentUsd), lpFix: { commitmentUsd: f.commitmentUsd } });
  if (f.legalName && normName(f.legalName) !== normName(lp.name)) out.push({ key: "name", label: "Legal name", letter: f.legalName, record: lp.name, lpFix: { name: f.legalName } });
  if (f.letterDate && l.signedDate && f.letterDate !== l.signedDate) out.push({ key: "date", label: "Letter date", letter: fmtDate(f.letterDate), record: fmtDate(l.signedDate) + " (signed date on file)", letterFix: { signedDate: f.letterDate } });
  if (f.closing && normName(f.closing) !== normName(lp.close)) out.push({ key: "closing", label: "Closing", letter: f.closing, record: lp.close || "—", lpFix: { close: f.closing } });
  return out;
}
/* A mismatch stays open until it is fixed on the record or overridden with a note for the same letter value. */
function openMismatches(l, lp) {
  const checks = l.factChecks || {};
  return factMismatches(l, lp).filter((m) => !(checks[m.key] && checks[m.key].letter === m.letter && checks[m.key].status === "overridden"));
}

function LetterFactsCard({ l }) {
  const s = useStore();
  const lp = s.all.lps.find((x) => x.id === l.lpId);
  const [notes, setNotes] = useState({});
  const [mfn, setMfn] = useState(null);
  const [reading, setReading] = useState(false);
  const p = l.mfnProposal;
  useEffect(() => { setMfn(p ? { excludedCategories: p.excludedCategories || [], excludedGrantBases: p.excludedGrantBases || [], basis: p.basis, thresholdM: p.thresholdUsd != null ? p.thresholdUsd / 1e6 : "", note: p.note || "", hasMfn: !!p.hasMfn } : null); }, [p && C.canon(p)]);
  if (l.source === "manual") return null;
  const all = factMismatches(l, lp); const open = openMismatches(l, lp);
  async function read() {
    setReading(true);
    await act("Reading letter facts", async () => { await readLetterFacts(l.id); toast("ok", "Letter facts and MFN clause read."); });
    setReading(false);
  }
  async function fixRecord(m) {
    await act("Updating the record", async () => {
      if (m.lpFix) { await patch("lps/" + lp.id, m.lpFix); }
      if (m.letterFix) { await patch("letters/" + l.id, m.letterFix); }
      await patch("letters/" + l.id, { factChecks: { ...(l.factChecks || {}), [m.key]: { status: "fixed", letter: m.letter, record: m.record, by: RT.meId, at: new Date().toISOString() } } });
      await appendAudit(m.lpFix ? "lp.updated_from_letter" : "letter.updated_from_text", m.lpFix ? "lp" : "letter", m.lpFix ? lp.id : l.id, `${m.label} for ${lp.name} changed from ${m.record} to ${m.letter} to match the side letter`, { field: m.key, before: m.record, after: m.letter, letterId: l.id });
    });
  }
  async function override(m) {
    const note = (notes[m.key] || "").trim(); if (!note) return;
    await act("Saving override", async () => {
      await patch("letters/" + l.id, { factChecks: { ...(l.factChecks || {}), [m.key]: { status: "overridden", note, letter: m.letter, record: m.record, by: RT.meId, at: new Date().toISOString() } } });
      await appendAudit("letter.fact_overridden", "letter", l.id, `Kept the record's ${m.label.toLowerCase()} (${m.record}) although the letter says ${m.letter}: ${note}`, { field: m.key, note });
    });
  }
  async function confirmMfn() {
    await act("Confirming MFN carve-outs", async () => {
      const conf = { ...p, hasMfn: mfn.hasMfn, basis: mfn.basis, thresholdUsd: mfn.thresholdM === "" || mfn.thresholdM == null ? null : Math.round(Number(mfn.thresholdM) * 1e6), excludedCategories: mfn.excludedCategories, excludedGrantBases: mfn.excludedGrantBases, note: mfn.note, confirmed: true, confirmedBy: RT.meId, confirmedAt: new Date().toISOString() };
      await patch("letters/" + l.id, { mfnProposal: conf });
      await appendAudit("letter.mfn_confirmed", "letter", l.id, `Confirmed MFN clause settings for ${lp.name}: ${conf.hasMfn ? mfnSummary({ commitmentUsd: lp.commitmentUsd, mfn: conf }) : "no MFN clause"}`, { proposed: { excludedCategories: p.excludedCategories, excludedGrantBases: p.excludedGrantBases, basis: p.basis }, confirmed: { excludedCategories: conf.excludedCategories, excludedGrantBases: conf.excludedGrantBases, basis: conf.basis, thresholdUsd: conf.thresholdUsd } });
    });
  }
  return html`<div class="card"><h3>Letter vs LP record, and MFN clause</h3>
    ${!l.facts ? html`<p class="small">The letter's commitment, legal name, date, closing and MFN clause haven't been read yet. They must be checked before this review can finish.</p>
      <div class="row"><button class="btn primary" disabled=${s.readOnly || reading || !RT.sample} onClick=${read}>${reading ? "Reading…" : "Read letter facts and MFN clause"}</button>${!RT.sample ? html`<span class="small muted">Needs Claude, which is not available in this view.</span>` : null}</div>` : html`
      ${all.length ? html`<div class="tablewrap"><table class="tbl"><thead><tr><th>Field</th><th>Letter says</th><th>LP record says</th><th></th></tr></thead><tbody>
        ${all.map((m) => { const ov = (l.factChecks || {})[m.key]; const done = ov && ov.letter === m.letter && ov.status === "overridden"; return html`<tr key=${m.key}><td>${m.label}</td><td>${m.letter}</td><td>${m.record}</td>

            ${mfn.basis === "size" ? html`<${Field} label="Commitment limit ($M)" hint="Blank = this LP's own commitment"><input id="mc-thr" type="number" value=${mfn.thresholdM} onInput=${(e) => setMfn({ ...mfn, thresholdM: e.target.value })} /><//>` : null}

      </div>` : null}
      <div class="row"><button class="btn small ghost" disabled=${s.readOnly || reading || !RT.sample} onClick=${read}>${reading ? "Reading…" : "Read the letter again"}</button>${open.length ? html`<span class="small bad-text">${open.length} ${open.length === 1 ? "mismatch" : "mismatches"} to resolve before finishing.</span>` : null}</div>`}

/* ---- Grant basis backfill for terms approved before grant bases existed ---- */
async function proposeGrantBases(onProgress) {
  const s = store.state;
  const need = s.terms.filter((t) => t.status === "approved" && C.grantBasesOf(t) == null && !t.grantBasisProposal);
  const byLetter = {}; for (const t of need) (byLetter[t.letterId] = byLetter[t.letterId] || []).push(t);
  const letters = Object.keys(byLetter).map((id) => s.letters.find((l) => l.id === id)).filter(Boolean);
  let done = 0, made = 0;
  for (const l of letters) {
    const terms = byLetter[l.id];
    const prompt = `For each term already approved from this side letter of a private infrastructure fund, say why the fund granted it.
Grant bases: "size" (tied to the size of the investor's commitment), "closing" (tied to when the investor was admitted, such as the first or initial closing), "lp_status" (exists because of what the investor legally is: public-records laws, sovereign immunity, ERISA plan assets, insurance regulation, fund-of-funds look-through, state investment policies), "anchor" (granted as part of an anchor or cornerstone package). Use [] when none applies; several can apply. Base the answer on the letter's words only.

Side letter, numbered paragraphs:
${(l.paragraphs || []).map((p, i) => `[${i + 1}] ${p}`).join("\n")}

Terms (index: summary | paragraphs | conditions):
${terms.map((t, i) => `${i}: ${t.summary} | ¶ ${(t.paragraphs || []).join(", ")} | ${t.conditions}`).join("\n")}

Reply with only JSON: {"terms":[{"index":<n>,"grantBasis":[...],"reason":"one short sentence citing the paragraph"}]}`;
    try {
      const r = await callModel(prompt);
      const rows = Array.isArray(r.json?.terms) ? r.json.terms : [];
      for (const row of rows) {
        const t = terms[Number(row.index)]; const b = C.normGrantBases(row.grantBasis);
        if (!t || !Array.isArray(b)) continue;
        await patch("terms/" + t.id, { grantBasisProposal: { bases: b, reason: String(row.reason || "").trim(), model: r.model, modelApplied: r.modelApplied, at: new Date().toISOString(), by: RT.meId } });
        made++;
      }
      await appendAudit("term.grant_basis_proposed", "letter", l.id, `Drafted grant bases for ${rows.length} approved ${lpName(l.lpId)} terms`, { model: r.model, modelApplied: r.modelApplied, terms: rows.map((x) => ({ termId: terms[Number(x.index)]?.id, grantBasis: x.grantBasis })) });
    } catch (e) { toast("bad", `${lpName(l.lpId)}: ${errText(e)}`); }
    done++; onProgress && onProgress(done, letters.length);
  }
  return made;
}

function GrantBasisProposals() {
  const s = useStore();
  const [edits, setEdits] = useState({});
  const [running, setRunning] = useState(null);
  const [confirmAll, setConfirmAll] = useState(false);
  const unset = s.terms.filter((t) => t.status === "approved" && C.grantBasesOf(t) == null);
  const pending = unset.filter((t) => t.grantBasisProposal);
  const notYet = unset.filter((t) => !t.grantBasisProposal);
  if (!unset.length) return null;
  async function run() {
    setRunning([0, 0]);
    await act("Drafting grant bases", async () => { const n = await proposeGrantBases((a, b) => setRunning([a, b])); toast("ok", `Drafted grant bases for ${n} terms. Approve each one below.`); });
    setRunning(null);
  }
  const valueOf = (t) => edits[t.id] ?? t.grantBasisProposal.bases;
  async function approve(list) {
    await act("Saving grant bases", async () => {
      for (const t of list) {
        const b = valueOf(t);
        await patch("terms/" + t.id, { grantBasis: b, grantBasisProposal: null, grantBasisSetBy: RT.meId, grantBasisSetAt: new Date().toISOString() });
        await appendAudit("term.grant_basis_set", "term", t.id, `Set grant basis for ${lpName(t.lpId)} term "${t.summary}": ${b.length ? b.map(C.grantBasisLabel).join(", ") : "none"}`, { proposed: t.grantBasisProposal.bases, approved: b });
      }
      toast("ok", `${list.length} grant ${list.length === 1 ? "basis" : "bases"} saved.`); setConfirmAll(false);
    });
  }
  return html`<div class="card"><h3>Grant basis for approved terms</h3>
    <p class="small">${unset.length} approved ${unset.length === 1 ? "term has" : "terms have"} no grant basis, so election worksheets show them as "Needs a decision".${pending.length ? ` ${pending.length} drafted and waiting for approval.` : ""}</p>
    ${notYet.length ? html`<div class="row"><button class="btn" disabled=${s.readOnly || !!running || !RT.sample} onClick=${run}>${running ? `Drafting… ${running[0]} of ${running[1] || "?"} letters` : `Draft grant bases for ${notYet.length} terms`}</button>${!RT.sample ? html`<span class="small muted">Needs Claude, which is not available in this view.</span>` : null}</div>` : null}
    ${pending.length ? html`<div class="tablewrap"><table class="tbl"><thead><tr><th>LP</th><th>Term</th><th>Granted for</th><th>Why</th><th></th></tr></thead><tbody>
      ${pending.map((t) => html`<tr key=${t.id}><td>${lpName(t.lpId)}</td><td class="small">${t.summary}</td>
        <td><${Toggles} values=${valueOf(t)} options=${C.GRANT_BASES} onChange=${(v) => setEdits({ ...edits, [t.id]: v })} />${!valueOf(t).length ? html`<span class="small muted">None</span>` : null}</td>
        <td class="small muted">${t.grantBasisProposal.reason}</td>
        <td><button class="btn small" disabled=${s.readOnly} onClick=${() => approve([t])}>Approve</button></td></tr>`)}
    </tbody></table></div>
    <div class="row end">${confirmAll ? html`<span class="small">Approve all ${pending.length} as shown?</span><button class="btn primary" disabled=${s.readOnly} onClick=${() => approve(pending)}>Yes, approve ${pending.length}</button><button class="btn ghost" onClick=${() => setConfirmAll(false)}>Cancel</button>`
      : html`<button class="btn" disabled=${s.readOnly} onClick=${() => setConfirmAll(true)}>Approve all ${pending.length} as shown</button>`}</div>` : null}
  </div>`;
}

function ReviewLetter({ id }) {
  const s = useStore();
  const l = s.letters.find((x) => x.id === id);
  const [adding, setAdding] = useState(null);
  const [retry, setRetry] = useState(null);
  if (!l) return html`<section class="view"><${Empty} title="Side letter not found"><a href="#review">Back to the review queue</a><//></section>`;
  const terms = s.terms.filter((t) => t.letterId === l.id);
  const cov = C.coverage(l, s.terms);
  const lflags = C.letterFlags(l, s.terms);
  const rank = (t) => (t.status === "draft" ? (C.termFlags(t, l).length ? 0 : 1) : t.status === "approved" ? 2 : 3);
  const sorted = [...terms].sort((a, b) => rank(a) - rank(b));
  const drafts = terms.filter((t) => t.status === "draft");
  const openIssues = (l.secondPass?.issues || []).filter((i) => !i.resolved);
  const lpRec = s.all.lps.find((x) => x.id === l.lpId);
  const factsNeeded = l.source !== "manual";
  const mism = factsNeeded ? openMismatches(l, lpRec) : [];
  const factsOk = !factsNeeded || (!!l.facts && !mism.length);
  const mfnOk = !factsNeeded || (!!l.mfnProposal && l.mfnProposal.confirmed);
  const canFinish = l.status === "needs_review" && !drafts.length && !cov.unaccounted.length && !openIssues.length && terms.some((t) => t.status === "approved") && factsOk && mfnOk;

  async function setNoObligation(n, on) {
    await act("Updating", async () => {
      const set = new Set(l.noObligation || []); on ? set.add(n) : set.delete(n);
      await patch("letters/" + l.id, { noObligation: [...set].sort((a, b) => a - b) });
      await appendAudit(on ? "paragraph.no_obligation" : "paragraph.unmarked", "letter", l.id, `${on ? "Marked" : "Unmarked"} ¶ ${n} of ${lpName(l.lpId)} letter as "no obligation"`, { paragraph: n });
    });
  }
  async function resolveIssue(iss, note) {
    await act("Resolving", async () => {
      const issues = (l.secondPass.issues || []).map((i) => (i.id === iss.id ? { ...i, resolved: true, resolution: note, resolvedBy: RT.meId, resolvedAt: new Date().toISOString() } : i));
      await patch("letters/" + l.id, { secondPass: { ...l.secondPass, issues } });
      await appendAudit("secondpass.resolved", "letter", l.id, `Resolved second-pass issue: ${iss.problem}`, { issueId: iss.id, resolution: note });
    });
  }
  async function finish() {
    await act("Finishing review", async () => {
      await patch("letters/" + l.id, { status: "approved", reviewedBy: RT.meId, reviewedAt: new Date().toISOString() });
      const mp = l.mfnProposal;
      if (mp && mp.confirmed && lpRec) {
        const before = lpRec.mfn || {};
        const mfnNew = { hasMfn: mp.hasMfn, basis: mp.basis, thresholdUsd: mp.thresholdUsd ?? null, excludedCategories: mp.excludedCategories || [], excludedGrantBases: mp.excludedGrantBases || [], excludedTermIds: before.excludedTermIds || [], note: mp.note || "", fromLetterId: l.id };
        await patch("lps/" + lpRec.id, { mfn: mfnNew });
        await appendAudit("lp.mfn_from_letter", "lp", lpRec.id, `Set ${lpRec.name}'s MFN clause settings from its reviewed side letter: ${mp.hasMfn ? mfnSummary({ commitmentUsd: lpRec.commitmentUsd, mfn: mfnNew }) : "no MFN clause"}`, { before, after: mfnNew, letterId: l.id });
      }
      await appendAudit("letter.reviewed", "letter", l.id, `Finished review of ${lpName(l.lpId)} side letter: ${terms.filter((t) => t.status === "approved").length} approved terms`, { approved: terms.filter((t) => t.status === "approved").map((t) => t.id) });
      toast("ok", "Review finished."); go("#letter-" + l.id);
    });
  }
  async function doRetry() {
    setRetry([]);
    await act("Extracting", async () => { try { await runExtraction(l.id, { onStep: (k, st, t) => setRetry((xs) => [...(xs || []).filter((x) => x.k !== k), { k, st, t }]) }); } catch {} });
  }
  return html`<section class="view wide">
    <a class="back" href="#review">← Review queue</a>
    <div class="view-h"><div><h1>Review: ${lpName(l.lpId)}</h1><p class="muted">${l.title} · signed ${fmtDate(l.signedDate)} · ${l.vehicle} · <a href=${"#letter-" + l.id}>letter and original</a></p></div>
      <div class="row"><${StatusPill} status=${l.status} /><button class="btn primary" disabled=${!canFinish || s.readOnly} onClick=${finish}>Finish review</button></div></div>

    <div class="checklist card">
      <div class=${drafts.length ? "todo" : "done"}><span class="dot"></span>${drafts.length ? `${drafts.length} draft ${drafts.length === 1 ? "term needs" : "terms need"} approval or rejection` : "Every term approved or rejected"}</div>
      <div class=${cov.unaccounted.length ? "todo" : "done"}><span class="dot"></span>${l.source === "manual" ? "No letter text (entered by hand)" : cov.unaccounted.length ? `${cov.unaccounted.length === 1 ? "Paragraph" : "Paragraphs"} ${cov.unaccounted.join(", ")} not linked to a term or marked "no obligation"` : "Every paragraph accounted for"}</div>
      <div class=${openIssues.length ? "todo" : "done"}><span class="dot"></span>${openIssues.length ? `${openIssues.length} second-pass ${openIssues.length === 1 ? "issue" : "issues"} open` : l.secondPass ? "Second-pass issues resolved" : "No second-pass check on record"}</div>
      ${factsNeeded ? html`<div class=${factsOk ? "done" : "todo"}><span class="dot"></span>${!l.facts ? "Letter facts not read yet" : mism.length ? `${mism.length} letter vs LP record ${mism.length === 1 ? "mismatch" : "mismatches"} open` : "LP record matches the letter"}</div>
      <div class=${mfnOk ? "done" : "todo"}><span class="dot"></span>${mfnOk ? "MFN clause settings confirmed" : "MFN clause settings not confirmed"}</div>` : null}
    </div>
    <${LetterFactsCard} l=${l} />

    ${l.status === "failed" ? html`<div class="note bad">Extraction failed: ${l.extraction?.error || "unknown error"}.
      <div class="row">${l.paragraphs?.length && RT.sample ? html`<button class="btn" onClick=${doRetry} disabled=${s.readOnly}>Retry with ${s.config?.model?.pinned}</button>` : null}
      <button class="btn" onClick=${() => setAdding({})} disabled=${s.readOnly}>Enter terms by hand</button></div></div>` : null}
    ${retry ? html`<ol class="steps card">${retry.map((x) => html`<li class=${"step " + x.st}><span class="dot"></span>${x.t}</li>`)}</ol>` : null}

    ${lflags.length ? html`<div class="card"><h3>Letter-level flags</h3>
      ${lflags.filter((f) => f.type === "coverage").map((f) => html`<div class="issue"><div><${Pill} kind="warn">Coverage<//> <span class="muted small">¶ ${f.paragraph}</span></div><${Clause} text=${l.paragraphs[f.paragraph - 1]} n=${f.paragraph} />
        <div class="row"><button class="btn" disabled=${s.readOnly} onClick=${() => setAdding({ paragraphs: [f.paragraph], quote: l.paragraphs[f.paragraph - 1] })}>Add a term for ¶ ${f.paragraph}</button><button class="btn ghost" disabled=${s.readOnly} onClick=${() => setNoObligation(f.paragraph, true)}>Mark "no obligation"</button></div></div>`)}
      ${openIssues.filter((i) => !i.termId).map((iss) => html`<${IssueResolver} key=${iss.id} iss=${iss} onResolve=${resolveIssue} disabled=${s.readOnly} />`)}
    </div>` : null}

    <div class="review-grid">
      <div class="card doc">
        <h3>Letter text</h3>
        ${l.source === "manual" ? html`<p class="muted">Entered by hand: no stored letter.</p>` : html`<ol class="paras">${(l.paragraphs || []).map((p, i) => { const row = cov.rows[i]; return html`<li class=${"para p-" + row.state}>
          <span class="pn">¶ ${i + 1}</span><div><p>${p}</p><div class="small row">
            ${row.state === "term" ? html`<span class="muted">${row.termIds.map((tid) => catName(s.terms.find((t) => t.id === tid)?.category)).join(", ")}</span>` : row.state === "none" ? html`<span class="muted">No obligation</span> <button class="linkbtn" disabled=${s.readOnly} onClick=${() => setNoObligation(i + 1, false)}>undo</button>` : html`<${Pill} kind="warn">Not linked<//>`}
            ${!s.readOnly ? html`<button class="linkbtn" onClick=${() => setAdding({ paragraphs: [i + 1], quote: p })}>+ term from ¶ ${i + 1}</button>` : null}
          </div></div></li>`; })}</ol>`}
      </div>
      <div class="stack">
        <div class="row"><h3>${terms.length} terms</h3><button class="btn small" disabled=${s.readOnly} onClick=${() => setAdding({})}>Add a term by hand</button></div>
        ${adding ? html`<${TermEditor} key=${"new-" + C.canon(adding)} letter=${l} isNew=${true} seed=${adding} onDone=${() => setAdding(null)} />` : null}
        ${sorted.map((t) => html`<${TermEditor} key=${t.id} t=${t} letter=${l} />`)}
      </div>
    </div>
  </section>`;
}

/* ---------------- MFN ---------------- */
function itemEligibility(elector, grantee, terms, bundle) {
  const rows = terms.map((t) => C.mfnEligibility(elector, grantee, t, bundle));
  if (!bundle || !bundle.allOrNothing) return rows[0];
  const bad = rows.findIndex((r) => r.status === "not_eligible");
  if (bad >= 0) return { status: "not_eligible", reasons: [`Bundle includes "${terms[bad].summary}": ${rows[bad].reasons[0]}`, "All-or-nothing bundle, so none of it can be elected"] };
  if (rows.some((r) => r.status === "review")) return { status: "review", reasons: [...new Set(rows.flatMap((r) => r.reasons))] };
  return { status: "eligible", reasons: [...new Set(rows.flatMap((r) => r.reasons))] };
}
/* Builds the offer list for one LP from every approved, live term held by other LPs. Every electable term ends up either included or listed with the reason it was left out. */
function buildPackage(elector, s) {
  const lpById = Object.fromEntries(s.lps.map((l) => [l.id, l]));
  const live = s.terms.filter((t) => t.status === "approved" && t.lpId !== elector.id);
  const done = new Set(); const items = []; const notIncluded = [];
  let considered = 0;
  for (const t of live) {
    if (done.has(t.id)) continue;
    const bundle = t.bundleId ? s.bundles.find((b) => b.id === t.bundleId) : null;
    const group = bundle && bundle.allOrNothing ? s.terms.filter((x) => bundle.termIds.includes(x.id) && x.status === "approved") : [t];
    group.forEach((x) => done.add(x.id));
    if (!group.some((x) => x.mfnStatus === "electable")) continue; // excluded terms are not offered; they are listed on the term itself
    considered++;
    const grantee = lpById[t.lpId];
    const el = itemEligibility(elector, grantee, group, bundle && bundle.allOrNothing ? bundle : null);
    const snapshot = group.map((x) => ({ termId: x.id, lpName: lpById[x.lpId]?.name || "", category: catName(x.category), summary: x.summary, quote: x.quote, conditions: x.conditions, expiry: x.expiry }));
    const item = { key: bundle && bundle.allOrNothing ? "b:" + bundle.id : "t:" + t.id, kind: bundle && bundle.allOrNothing ? "bundle" : "term", termIds: group.map((x) => x.id), bundleId: bundle?.id || null, bundleName: bundle?.name || null, allOrNothing: !!bundle?.allOrNothing, eligibility: el.status, reasons: el.reasons, snapshot, decision: el.status === "eligible" ? "include" : null, decisionNote: "" };
    if (el.status === "not_eligible") notIncluded.push({ key: item.key, termIds: item.termIds, label: bundle && bundle.allOrNothing ? `Bundle: ${bundle.name} (${grantee?.name})` : `${catName(t.category)}: ${t.summary} (${grantee?.name})`, reasons: el.reasons });
    else items.push(item);
  }
  return { items, notIncluded, considered };
}
const itemsHash = (items) => C.sha256Text(C.canon(items.map(({ key, termIds, snapshot, decision }) => ({ key, termIds, snapshot, decision }))));
